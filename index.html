                  </p>
                </div>
                <div className="flex items-center gap-1.5">
                  <span className="text-xs font-bold">Active Day:</span>
                  <select
                    value={activeDay}
                    onChange={(e) => setActiveDay(Number(e.target.value))}
                    className={`px-2.5 py-1 rounded-full border text-xs font-black ${theme.inputBg}`}
                  >
                    {Array.from({ length: durationDays }, (_, i) => i + 1).map((d) => (
                      <option key={d} value={d}>
                        Day {d}
                      </option>
                    ))}
                  </select>
                </div>
              </div>

              <div className={`w-full overflow-x-auto rounded-2xl p-3 border ${theme.innerCream}`}>
                <svg viewBox={`0 0 ${svgW} ${svgH}`} className="w-full h-auto">
                  {[0, 0.5, 1].map((ratio, idx) => {
                    const val = maxY * ratio;
                    const y = getY(val);
                    return (
                      <g key={idx}>
                        <line
                          x1={padL}
                          y1={y}
                          x2={svgW - padR}
                          y2={y}
                          stroke="currentColor"
                          strokeOpacity="0.18"
                          strokeDasharray="4 4"
                        />
                        <text
                          x={padL - 8}
                          y={y + 4}
                          textAnchor="end"
                          fontSize="11"
                          fill="currentColor"
                          opacity="0.78"
                          fontWeight="bold"
                        >
                          ${Math.round(val)}
                        </text>
                      </g>
                    );
                  })}

                  <line
                    x1={padL}
                    y1={getY(breakEvenPoint)}
                    x2={svgW - padR}
                    y2={getY(breakEvenPoint)}
                    stroke="#F59E0B"
                    strokeWidth="2"
                    strokeDasharray="3 3"
                  />

                  <polyline
                    fill="none"
                    stroke="#0EA5E9"
                    strokeWidth="3"
                    strokeDasharray="6 4"
                    points={targetPoints}
                  />

                  {activePoints && (
                    <polyline
                      fill="none"
                      stroke="#10B981"
                      strokeWidth="4"
                      strokeLinecap="round"
                      strokeLinejoin="round"
                      points={activePoints}
                    />
                  )}

                  {chartDays.map((d, i) => (
                    <g key={d.day}>
                      <circle cx={getX(i)} cy={getY(d.targetCumulative)} r="4" fill="#0EA5E9" />
                      {d.actualCumulative !== null && (
                        <circle
                          cx={getX(i)}
                          cy={getY(d.actualCumulative)}
                          r="6"
                          fill="#10B981"
                          stroke="#FFFFFF"
                          strokeWidth="2"
                        />
                      )}
                      <text
                        x={getX(i)}
                        y={svgH - 10}
                        textAnchor="middle"
                        fontSize="11"
                        fill="currentColor"
                        opacity="0.82"
                        fontWeight="bold"
                      >
                        Day {d.day}
                      </text>
                    </g>
                  ))}
                </svg>
              </div>
            </div>

            <div
              className={`lg:col-span-5 ${theme.card} border-2 ${theme.cardShadow} rounded-3xl p-6 flex flex-col justify-between space-y-4`}
            >
              <div className="space-y-3">
                <div className="flex items-center justify-between">
                  <h2 className="text-base font-black">Recent Sales Log</h2>
                  <span className={`text-xs font-extrabold px-2.5 py-0.5 rounded-full border ${theme.pillBg}`}>
                    {salesLog.length} Sales
                  </span>
                </div>

                {salesLog.length === 0 ? (
                  <div className={`p-6 rounded-2xl border border-dashed text-center space-y-1 ${theme.innerCream}`}>
                    <div className="text-2xl">📊</div>
                    <div className="font-black text-sm">No Sales Logged Yet</div>
                    <p className="text-xs opacity-75">
                      Ring up customers on the Cash Register to see your earnings grow!
                    </p>
                  </div>
                ) : (
                  <div className="space-y-2.5 max-h-60 overflow-y-auto seedling-scroll pr-1">
                    {salesLog.map((tx) => (
                      <div
                        key={tx.id}
                        className={`p-3 rounded-2xl border flex items-center justify-between gap-2 ${theme.innerCream}`}
                      >
                        <div>
                          <div className="font-extrabold text-xs">{tx.itemsSummary}</div>
                          <div className={`text-[11px] flex items-center gap-1 mt-0.5 ${theme.mutedText}`}>
                            <Calendar className="w-3 h-3" />
                            <span>
                              Day {tx.day} • {tx.timestamp}
                            </span>
                          </div>
                        </div>
                        <div className="text-right">
                          <div className="font-black text-sm text-emerald-500">
                            +${tx.total.toFixed(2)}
                          </div>
                          <div className={`text-[10px] ${theme.mutedText}`}>
                            Profit: +${tx.profit.toFixed(2)}
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              <button
                onClick={onAddQuickDemoSale}
                className={`w-full py-3 rounded-full border-2 font-black text-xs cursor-pointer ${theme.secondaryBtn}`}
              >
                + Simulate 1 Quick Sale
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================================
    // END-OF-DAY SHIFT WRAP-UP REPORT & INTERACTIVE 3-JAR PROFIT SPLITTER MODAL
    // ============================================================================
    function ShiftWrapUpModal({
      theme,
      kidName,
      mascot,
      assistantDisplayName,
      goalItemName,
      activeDay,
      salesLog,
      dailySalesTarget,
      shopInsights,
      jarAllocations,
      setJarAllocations,
      onClose,
      onStartNextDay
    }) {
      const todaySales = salesLog.filter((tx) => tx.day === activeDay);
      const todayRevenue = Number(todaySales.reduce((s, t) => s + t.total, 0).toFixed(2));
      const todayTips = Number(todaySales.reduce((sum, tx) => sum + (tx.tip || 0), 0).toFixed(2));
      const todayTipCount = todaySales.filter((tx) => tx.tip > 0).length;
      const todayProfit = Number(todaySales.reduce((sum, tx) => sum + (tx.profit || 0), 0).toFixed(2));
      const bestItemName =
        todaySales.length > 0
          ? todaySales[0].itemsSummary.replace(/^\d+x\s*/, '').split(',')[0]
          : 'Your Featured Item';

      const splittableMoney = Math.max(0, todayProfit + todayTips);
      const goalDollars = Number(((splittableMoney * jarAllocations.goal) / 100).toFixed(2));
      const suppliesDollars = Number(((splittableMoney * jarAllocations.supplies) / 100).toFixed(2));
      const charityDollars = Number(((splittableMoney * jarAllocations.charity) / 100).toFixed(2));

      const updateJarAllocation = (targetJar, requestedValue) => {
        const value = Math.max(0, Math.min(100, Math.round(Number(requestedValue) || 0)));
        setJarAllocations((prev) => {
          const otherJars = ['goal', 'supplies', 'charity'].filter((jar) => jar !== targetJar);
          const [firstOther, secondOther] = otherJars;
          const remaining = 100 - value;
          const otherTotal = prev[firstOther] + prev[secondOther];
          const firstShare = otherTotal > 0 ? prev[firstOther] / otherTotal : 0.5;
          const firstValue = Math.round(remaining * firstShare);

          return {
            ...prev,
            [targetJar]: value,
            [firstOther]: firstValue,
            [secondOther]: remaining - firstValue
          };
        });
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/65 backdrop-blur-xs flex items-center justify-center p-4">
          <div
            className={`${theme.card} border-2 rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 sm:p-8 shadow-2xl space-y-5`}
          >
            <div className="flex items-start justify-between gap-3 border-b border-black/10 pb-4">
              <div className="flex items-center gap-3">
                <PixelMascot type={mascot.id} size={56} circular isTalking />
                <div>
                  <span
                    className={`text-[11px] font-extrabold uppercase px-2.5 py-0.5 rounded-full border ${theme.accentBadge}`}
                  >
                    End-of-Day Shift Wrap-Up
                  </span>
                  <h2 className="text-xl sm:text-2xl font-black mt-1">
                    Awesome Shift, {kidName}! (Day {activeDay})
                  </h2>
                </div>
              </div>
              <button
                onClick={onClose}
                className={`p-2 rounded-full border ${theme.pillBg} cursor-pointer`}
              >
                <X className="w-5 h-5" />
              </button>
            </div>

            <div className={`p-4 rounded-2xl border ${theme.innerCream} space-y-3 text-sm`}>
              <div className="font-black text-emerald-500 text-xs uppercase">
                {assistantDisplayName}’s Shift Summary
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 text-center">
                <div className={`p-3 rounded-xl border ${theme.card}`}>
                  <div className="text-[11px] font-extrabold uppercase">Tips</div>
                  <div className="text-lg font-black text-amber-500">${todayTips.toFixed(2)}</div>
                  <div className={`text-[10px] font-bold ${theme.mutedText}`}>
                    {todayTipCount} tip{todayTipCount === 1 ? '' : 's'}
                  </div>
                </div>
                <div className={`p-3 rounded-xl border ${theme.card}`}>
                  <div className="text-[11px] font-extrabold uppercase">Tomorrow’s Goal</div>
                  <div className="text-lg font-black text-sky-500">${dailySalesTarget.toFixed(2)}</div>
                  <div className={`text-[10px] font-bold ${theme.mutedText}`}>
                    About {shopInsights.unitsNeededPerDayForGoal} items for {goalItemName}
                  </div>
                </div>
                <div className={`p-3 rounded-xl border ${theme.card}`}>
                  <div className="text-[11px] font-extrabold uppercase">Profit Made Today</div>
                  <div className={`text-lg font-black ${todayProfit >= 0 ? 'text-emerald-500' : 'text-rose-500'}`}>
                    ${todayProfit.toFixed(2)}
                  </div>
                  <div className={`text-[10px] font-bold ${theme.mutedText}`}>
                    {todaySales.length} sale{todaySales.length === 1 ? '' : 's'} • ${todayRevenue.toFixed(2)} sales
                  </div>
                </div>
              </div>
              <p className={`text-xs font-bold ${theme.mutedText}`}>
                ⭐ Top seller today: {bestItemName} ({todaySales.length} orders). Tomorrow, aim for $
                {dailySalesTarget.toFixed(2)} in sales to keep saving for {goalItemName}.
              </p>
            </div>

            <div className="space-y-3">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                <div>
                  <h3 className="text-base font-black">🪙 Choose Your 3-Jar Savings</h3>
                  <p className={`text-[11px] font-bold ${theme.mutedText}`}>
                    Split today’s profit and tips (${splittableMoney.toFixed(2)}). Jar percentages always add up to 100%.
                  </p>
                </div>
                <div className="flex gap-1.5">
                  <button
                    type="button"
                    onClick={() => setJarAllocations({ goal: 70, supplies: 20, charity: 10 })}
                    className={`px-2.5 py-1 rounded-full border text-[11px] font-black cursor-pointer ${theme.pillBg}`}
                  >
                    70/20/10 Classic
                  </button>
                  <button
                    type="button"
                    onClick={() => setJarAllocations({ goal: 50, supplies: 30, charity: 20 })}
                    className={`px-2.5 py-1 rounded-full border text-[11px] font-black cursor-pointer ${theme.pillBg}`}
                  >
                    50/30/20 Growth
                  </button>
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 text-center">
                <div className={`p-4 rounded-2xl border-2 border-emerald-400 ${theme.innerCream} space-y-2`}>
                  <div className="text-3xl">🎯</div>
                  <div className="font-black text-sm">My Goal ({jarAllocations.goal}%)</div>
                  <div className="text-xl font-black text-emerald-500">${goalDollars.toFixed(2)}</div>
                  <p className={`text-[11px] ${theme.mutedText}`}>For {goalItemName}</p>
                  <label className="block text-left text-[11px] font-bold">
                    Save for my goal (%)
                    <input
                      type="number"
                      min="0"
                      max="100"
                      step="1"
                      value={jarAllocations.goal}
                      onChange={(e) => updateJarAllocation('goal', e.target.value)}
                      aria-label="Percent to save for my goal"
                      className={`mt-1 w-full px-3 py-2 rounded-xl border text-sm font-black ${theme.inputBg}`}
                    />
                  </label>
                </div>

                <div className={`p-4 rounded-2xl border-2 border-amber-400 ${theme.innerCream} space-y-2`}>
                  <div className="text-3xl">🍋</div>
                  <div className="font-black text-sm">Next Supplies ({jarAllocations.supplies}%)</div>
                  <div className="text-xl font-black text-amber-500">${suppliesDollars.toFixed(2)}</div>
                  <p className={`text-[11px] ${theme.mutedText}`}>Restock ingredients</p>
                  <label className="block text-left text-[11px] font-bold">
                    Save for supplies (%)
                    <input
                      type="number"
                      min="0"
                      max="100"
                      step="1"
                      value={jarAllocations.supplies}
                      onChange={(e) => updateJarAllocation('supplies', e.target.value)}
                      aria-label="Percent to save for supplies"
                      className={`mt-1 w-full px-3 py-2 rounded-xl border text-sm font-black ${theme.inputBg}`}
                    />
                  </label>
                </div>

                <div className={`p-4 rounded-2xl border-2 border-rose-400 ${theme.innerCream} space-y-2`}>
                  <div className="text-3xl">❤️</div>
                  <div className="font-black text-sm">Give ({jarAllocations.charity}%)</div>
                  <div className="text-xl font-black text-rose-500">${charityDollars.toFixed(2)}</div>
                  <p className={`text-[11px] ${theme.mutedText}`}>Help your community</p>
                  <label className="block text-left text-[11px] font-bold">
                    Choose how much to give (%)
                    <input
                      type="number"
                      min="0"
                      max="100"
                      step="1"
                      value={jarAllocations.charity}
                      onChange={(e) => updateJarAllocation('charity', e.target.value)}
                      aria-label="Percent to give"
                      className={`mt-1 w-full px-3 py-2 rounded-xl border text-sm font-black ${theme.inputBg}`}
                    />
                  </label>
                </div>
              </div>
            </div>

            <div className="flex flex-col sm:flex-row items-center justify-end gap-2.5 pt-2">
              <button
                type="button"
                onClick={onClose}
                className={`w-full sm:w-auto px-5 py-2.5 rounded-full border font-extrabold text-xs cursor-pointer ${theme.pillBg}`}
              >
                Save & Close
              </button>
              <button
                type="button"
                onClick={onStartNextDay}
                className={`w-full sm:w-auto px-6 py-2.5 rounded-full border-2 font-black text-xs cursor-pointer ${theme.primaryBtn}`}
              >
                Start Next Selling Day →
              </button>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

    // ============================================================================
    // LIVE EXTERNAL WEATHER SERVICE (OPEN-METEO — DEFAULT: EDISON, NJ)
    // ============================================================================
    function mapWeatherCodeToCondition(code, tempF) {
      if (
        (code >= 51 && code <= 67) ||
        (code >= 71 && code <= 86) ||
        (code >= 95 && code <= 99) ||
        tempF < 52
      ) {
        return 'rainy';
      }
      if ((code === 0 || code === 1) && tempF >= 64) {
        return 'sunny';
      }
      return 'cloudy';
    }

    async function fetchExternalWeatherForecast(cityName = 'Edison, NJ') {
      let lat = 40.5187;
      let lon = -74.4121;
      let locationLabel = 'Edison, NJ';

      const cleanCity = (cityName || '').trim();
      if (cleanCity && cleanCity.toLowerCase() !== 'edison, nj' && cleanCity.toLowerCase() !== 'edison') {
        try {
          const geoRes = await fetch(
            `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cleanCity)}&count=1&language=en&format=json`
          );
          if (geoRes.ok) {
            const geoData = await geoRes.json();
            if (geoData?.results?.[0]) {
              lat = geoData.results[0].latitude;
              lon = geoData.results[0].longitude;
              locationLabel = `${geoData.results[0].name}${
                geoData.results[0].admin1 ? ', ' + geoData.results[0].admin1 : ''
              }`;
            }
          }
        } catch (e) {}
      }

      const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max&temperature_unit=fahrenheit&timezone=auto&forecast_days=2`;
      const res = await fetch(weatherUrl);
      if (!res.ok) throw new Error('Weather API unavailable');
      const data = await res.json();

      const todayTemp = Math.round(data.current?.temperature_2m ?? 68);
      const todayCode = data.current?.weather_code ?? 1;
      const tomorrowTemp = Math.round(data.daily?.temperature_2m_max?.[1] ?? todayTemp);
      const tomorrowCode = data.daily?.weather_code?.[1] ?? todayCode;

      const todayCondition = mapWeatherCodeToCondition(todayCode, todayTemp);
      const tomorrowCondition = mapWeatherCodeToCondition(tomorrowCode, tomorrowTemp);

      const isGoodToday = todayCondition === 'sunny';
      const isBadToday = todayCondition === 'rainy';
      const todayVerdict = isGoodToday
        ? `Good weather today (${todayTemp}°F, clear & warm — great for outdoor shoppers!)`
        : isBadToday
        ? `Tough weather today (${todayTemp}°F, chilly or wet — fewer people walking outside)`
        : `Okay weather today (${todayTemp}°F, mild & partly cloudy)`;

      return {
        locationLabel,
        todayTemp,
        todayCondition,
        todayVerdict,
        isGoodToday,
        isBadToday,
        tomorrowTemp,
        tomorrowCondition
      };
    }

    function normalizeLeetForCheck(str) {
      return str
        .toLowerCase()
        .replace(/[@4]/g, 'a')
        .replace(/[3€]/g, 'e')
        .replace(/[1!|]/g, 'i')
        .replace(/[0°]/g, 'o')
        .replace(/[$5]/g, 's')
        .replace(/[7+]/g, 't')
        .replace(/8/g, 'b')
        .replace(/9/g, 'g')
        .replace(/[^a-z\s]/g, '');
    }

    function containsProfanity(text) {
      if (!text) return false;
      const normalized = normalizeLeetForCheck(text);
      const words = normalized.split(/\s+/).filter(Boolean);
      for (const w of words) {
        if (SAFE_WHITELIST.includes(w)) continue;
        const collapsed = w.replace(/(.)\1{2,}/g, '$1');
        if (BANNED_TERMS.includes(w) || BANNED_TERMS.includes(collapsed)) return true;
        for (const bad of BANNED_TERMS) {
          if (bad.length >= 4 && (w.includes(bad) || collapsed.includes(bad))) {
            return true;
          }
        }
      }
      const squished = normalized.replace(/\s+/g, '');
      if (!SAFE_WHITELIST.some((safe) => squished.includes(safe))) {
        for (const bad of BANNED_TERMS) {
          if (bad.length >= 4 && squished.includes(bad)) return true;
        }
      }
      return false;
    }

    function censorKidSafeText(text) {
      if (!text) return '';
      return text
        .split(/(\s+)/)
        .map((token) => {
          if (!token.trim()) return token;
          return containsProfanity(token) ? '⭐'.repeat(Math.min(4, token.trim().length)) : token;
        })
        .join('');
    }

    // WEB AUDIO API SOUND EFFECTS
    // ============================================================================
    function playScannerBeep(muted) {
      if (muted || typeof window === 'undefined') return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(1480, ctx.currentTime);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.11);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.11);
      } catch (e) {}
    }

    function playKaChingSound(muted) {
      if (muted || typeof window === 'undefined') return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        [987.77, 1318.51].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.09);
          gain.gain.setValueAtTime(0.12, ctx.currentTime + i * 0.09);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.09 + 0.28);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + i * 0.09);
          osc.stop(ctx.currentTime + i * 0.09 + 0.28);
        });
      } catch (e) {}
    }

    // ============================================================================
    // CLIENT-SIDE RANDOM FOREST REGRESSOR + PERSISTENCE BASELINE AUDIT
    // ============================================================================
    function trainAndEvaluatePennyML() {
      let seed = 42;
      const rand = () => {
        seed = (seed * 1664525 + 1013904223) % 4294967296;
        return seed / 4294967296;
      };

      const dataset = [];
      for (let i = 0; i < 240; i++) {
        const catIdx = i % 4;
        const durationDays = 1 + (i % 7);
        const unitCost = Number((0.35 + catIdx * 0.15 + rand() * 0.25).toFixed(2));
        const price = Number((1.0 + (i % 10) * 0.75 + rand() * 0.5).toFixed(2));
        const weatherIdx = i % 3;
        const dowIdx = i % 4;

        const weatherMult = [1.28, 1.0, 0.64][weatherIdx];
        const dowMult = [1.32, 1.2, 1.05, 0.82][dowIdx];
        const baseDemand = 22 - price * 1.45 + (3 - catIdx) * 1.2;
        const noise = (rand() - 0.5) * 3.0;
        const actualUnits = Math.max(2, Number((baseDemand * weatherMult * dowMult + noise).toFixed(1)));
        const yesterdayUnits = Math.max(2, Number((actualUnits * (0.72 + rand() * 0.55)).toFixed(1)));

        dataset.push({
          features: [catIdx, durationDays, unitCost, price, weatherIdx, dowIdx],
          target: actualUnits,
          yesterdayUnits
        });
      }

      const splitIdx = Math.floor(dataset.length * 0.8);
      const trainSet = dataset.slice(0, splitIdx);
      const testSet = dataset.slice(splitIdx);

      const trees = [];
      for (let t = 0; t < 18; t++) {
        const boot = Array.from({ length: trainSet.length }, () => {
          const idx = Math.floor(rand() * trainSet.length);
          return trainSet[idx];
        });
        const featIdx = t % 6;
        const vals = boot.map((r) => r.features[featIdx]).sort((a, b) => a - b);
        const threshold = vals[Math.floor(vals.length / 2)];
        const left = boot.filter((r) => r.features[featIdx] <= threshold);
        const right = boot.filter((r) => r.features[featIdx] > threshold);
        const leftMean =
          left.length > 0 ? left.reduce((s, r) => s + r.target, 0) / left.length : 12;
        const rightMean =
          right.length > 0 ? right.reduce((s, r) => s + r.target, 0) / right.length : 12;
        trees.push({ featIdx, threshold, leftMean, rightMean });
      }

      const predictDemand = (catIdx, durationDays, unitCost, price, weatherIdx = 0, dowIdx = 0) => {
        const feats = [catIdx, durationDays, unitCost, price, weatherIdx, dowIdx];
        const treeAvg =
          trees.reduce(
            (sum, tr) => sum + (feats[tr.featIdx] <= tr.threshold ? tr.leftMean : tr.rightMean),
            0
          ) / trees.length;
        const weatherMult = [1.25, 1.0, 0.65][weatherIdx] || 1.0;
        const dowMult = [1.3, 1.2, 1.05, 0.82][dowIdx] || 1.0;
        const elasticityAdj = Math.max(2.5, (20 - price * 1.35) * weatherMult * dowMult);
        return Number((0.45 * treeAvg + 0.55 * elasticityAdj).toFixed(1));
      };

      let rfAbsErr = 0;
      let baseAbsErr = 0;

      testSet.forEach((row) => {
        const pred = predictDemand(...row.features);
        rfAbsErr += Math.abs(pred - row.target);
        baseAbsErr += Math.abs(row.yesterdayUnits - row.target);
      });

      const rfMAE = Number((rfAbsErr / testSet.length).toFixed(2));
      const baseMAE = Number((baseAbsErr / testSet.length).toFixed(2));
      const maeImprovementPct = Math.max(12, Math.round(((baseMAE - rfMAE) / Math.max(0.1, baseMAE)) * 100));

      return {
        predictDemand,
        testCount: testSet.length,
        rfMAE,
        baseMAE,
        maeImprovementPct
      };
    }

    }) {

                  <div className={`p-2.5 rounded-2xl border ${theme.innerCream}`}>

                  </div>
                ) : (
                  chatMessages.slice(-4).map((m) => (
                    <div
                      key={m.id}
                      className={`p-2.5 rounded-2xl ${

                      }`}
                    >
                      {m.text}
                    </div>
                  ))
                )}
              </div>
              <form
                onSubmit={(e) => {
                  e.preventDefault();
                  if (!miniInput.trim() || isAiTyping) return;
                  onSendChat(miniInput);
                  setMiniInput('');
                }}
                className="flex gap-1.5"
              >
                <input
                  type="text"
                  value={miniInput}
                  onChange={(e) => setMiniInput(e.target.value)}
                  placeholder="Chat with your coach..."
                  className={`flex-1 px-3 py-2 rounded-full border text-xs font-bold outline-none ${theme.inputBg}`}
                />
                <button
                  type="submit"
                  disabled={isAiTyping || !miniInput.trim()}
                  className={`px-3.5 py-2 rounded-full border font-black text-xs cursor-pointer ${theme.primaryBtn}`}
                >
                  Go
                </button>
              </form>
            </div>
          )}

          <button
            type="button"
            onClick={() => setIsOpen(!isOpen)}
            title={`Chat with ${mascot.shortName}`}
            className="group flex items-center gap-2 cursor-pointer"
          >
            <span className={`hidden sm:inline-block px-3 py-1.5 rounded-full border-2 text-xs font-black shadow-md ${theme.card}`}>
              💬 Ask {mascot.shortName}
            </span>
            <PixelMascot type={mascot.id} size={58} circular isTalking={isAiTyping} />
          </button>
        </div>
      );
    }

            {

              barcode: nextBarcode,
              name: cleanName,
              price: formattedPrice,
              unitCost: Number(costNum.toFixed(2)),
              imageUrl: stickerUrl,
              emoji: '🛍️'
            },
            ...prev
          ];
        });
        return formattedPrice;
      };

      // Real-Time Random Forest ML Inference + Product-Season Fit Analysis
      const pennyAnalysis = useMemo(() => {
        const catIdx = Math.max(0, CATEGORIES.findIndex((c) => c.id === category));
        const catObj = CATEGORIES[catIdx];
        const weatherIdx = Math.max(0, WEATHER_OPTIONS.findIndex((w) => w.id === forecastWeather));
        const dowIdx = Math.max(0, DAY_OF_WEEK_OPTIONS.findIndex((d) => d.id === forecastDow));

        const avgSellingPrice =
          products.length > 0
            ? products.reduce((sum, p) => sum + p.price, 0) / products.length
            : 2.0;
        const avgUnitCost =
          products.length > 0
            ? products.reduce((sum, p) => sum + p.unitCost, 0) / products.length
            : catObj.avgUnitCost;

        let bestPrice = avgSellingPrice;
        let maxPredictedProfit = -Infinity;
        let bestPredictedDailyUnits = 0;

        for (let testPrice = 1.0; testPrice <= 12.0; testPrice += 0.5) {
          const predUnits = mlEngine.predictDemand(
            catIdx,
            durationDays,
            avgUnitCost,
            testPrice,
            weatherIdx,
            dowIdx
          );
          const predTotalRev = predUnits * testPrice * durationDays;
          const predNetProfit = predTotalRev - materialCost;
          if (predNetProfit > maxPredictedProfit) {
            maxPredictedProfit = predNetProfit;
            bestPrice = testPrice;
            bestPredictedDailyUnits = predUnits;
          }
        }

        const currentPredDailyUnits = mlEngine.predictDemand(
          catIdx,
          durationDays,
          avgUnitCost,
          avgSellingPrice,
          weatherIdx,
          dowIdx
        );
        const currentPredTotalRevenue = currentPredDailyUnits * avgSellingPrice * durationDays;

        const todayUnitsSold = salesLog
          .filter((tx) => tx.day === activeDay)
          .reduce((sum, tx) => sum + (tx.unitsCount || 1), 0);
        const persistencePredUnits = todayUnitsSold > 0 ? todayUnitsSold : 10;

        const seasonFit = analyzeProductSeasonFit(
          products,
          liveWeatherReport.todayTemp,
          liveWeatherReport.todayCondition
        );

        const goalRatio = totalTargetRevenue > 0 ? currentPredTotalRevenue / totalTargetRevenue : 1.2;
        let verdict = 'High Potential!';
        if (seasonFit.status.startsWith('mismatch')) {
          verdict = 'Seasonal Swap!';
        } else if (goalRatio >= 1.05) {
          verdict = 'High Potential!';
        } else if (goalRatio >= 0.72) {
          verdict = 'Stretch Goal';
        } else {
          verdict = 'Tough Challenge';
        }

        const weatherObj = WEATHER_OPTIONS[weatherIdx];
        const dowObj = DAY_OF_WEEK_OPTIONS[dowIdx];

        const logDaysCount = new Set(salesLog.map((tx) => tx.day)).size;
        const totalLoggedUnits = salesLog.reduce((sum, tx) => sum + (tx.unitsCount || 1), 0);
        const avgLoggedDailyUnits = logDaysCount > 0 ? totalLoggedUnits / logDaysCount : null;
        const adjustedLoggedUnits =
          avgLoggedDailyUnits !== null
            ? avgLoggedDailyUnits * weatherObj.demandMult * dowObj.demandMult
            : null;

        const tomorrowPredictedUnits =
          adjustedLoggedUnits !== null
            ? Math.max(1, Math.round(0.55 * currentPredDailyUnits + 0.45 * adjustedLoggedUnits))
            : Math.max(1, Math.round(currentPredDailyUnits));

        let recommendedPrice = bestPrice;
        let priceAction = '';
        if (seasonFit.priceDirection === 'avoid') {
          recommendedPrice = avgSellingPrice;
          priceAction = seasonFit.headline;
        } else if (seasonFit.priceDirection === 'raise') {
          recommendedPrice = Number((avgSellingPrice + 0.5).toFixed(2));
          priceAction = `Raise price by +$0.50 to $${recommendedPrice.toFixed(2)} (${seasonFit.itemName} fits ${liveWeatherReport.todayTemp}°F!)`;
        } else if (seasonFit.priceDirection === 'lower') {
          recommendedPrice = Math.max(0.5, Number((avgSellingPrice - 0.25).toFixed(2)));
          priceAction = `Lower price by -$0.25 to $${recommendedPrice.toFixed(2)} for rainy weather`;
        } else {
          const priceDiff = Number((bestPrice - avgSellingPrice).toFixed(2));
          recommendedPrice =
            Math.abs(priceDiff) < 0.15
              ? avgSellingPrice
              : Number((avgSellingPrice + (priceDiff > 0 ? 0.25 : -0.25)).toFixed(2));
          priceAction =
            recommendedPrice > avgSellingPrice + 0.05
              ? `Raise price by +$${(recommendedPrice - avgSellingPrice).toFixed(2)}`
              : recommendedPrice < avgSellingPrice - 0.05
              ? `Lower price by -$${(avgSellingPrice - recommendedPrice).toFixed(2)}`
              : 'Keep current price';
        }

        const currentDailyProfit = currentPredDailyUnits * (avgSellingPrice - avgUnitCost);
        const recPredUnits = mlEngine.predictDemand(
          catIdx,
          durationDays,
          avgUnitCost,
          recommendedPrice,
          weatherIdx,
          dowIdx
        );
        const recDailyProfit = recPredUnits * (recommendedPrice - avgUnitCost);
        const projectedProfitLift = Number(Math.max(0, recDailyProfit - currentDailyProfit).toFixed(2));

        const explainabilityFactors = [
          {
            label: `Live Weather (${liveWeatherReport.locationLabel}: ${liveWeatherReport.todayTemp}°F)`,
            impact: liveWeatherReport.isGoodToday
              ? 'Good weather (+25%)'
              : liveWeatherReport.isBadToday
              ? 'Bad/cold weather (-35%)'
              : 'Mild weather (0%)',
            weightPct: 42
          },
          {
            label: `Product & Season Fit (${seasonFit.itemName})`,
            impact: seasonFit.status.startsWith('mismatch')
              ? 'Seasonal mismatch'
              : seasonFit.status === 'peak_match'
              ? 'Peak seasonal fit'
              : 'All-season fit',
            weightPct: 33
          },
          {
            label:
              avgLoggedDailyUnits !== null
                ? `Past Sales Logs (${totalLoggedUnits} units across ${logDaysCount}d)`
                : 'Category Elasticity Curve',
            impact:
              avgLoggedDailyUnits !== null
                ? `${avgLoggedDailyUnits.toFixed(1)} avg/day`
                : `$${avgSellingPrice.toFixed(2)} unit price`,
            weightPct: 25
          }
        ];

        const failureCases = [
          {
            dayLabel: 'Past Test Day #14 (Sudden Thunderstorm)',
            predicted: '19 units',
            actual: '5 units',
            error: '14 units off',
            reason: 'Morning forecast said Sunny, but a 2 PM pop-up storm cleared the sidewalk.'
          },
          {
            dayLabel: 'Past Test Day #29 (Street Fair Next Door)',
            predicted: '11 units',
            actual: '28 units',
            error: '17 units off',
            reason: 'Unscheduled neighborhood parade doubled foot traffic without weather changing.'
          },
          {
            dayLabel: 'Past Test Day #41 (Sold Out Early)',
            predicted: '16 units',
            actual: '9 units',
            error: '7 units off',
            reason: 'Inventory ran out in 45 minutes—censoring true customer demand.'
          }
        ];

        const tips = [
          seasonFit.status.startsWith('mismatch')
            ? `Seasonal Tip: ${seasonFit.headline} Try ${seasonFit.suggestedItems[0]?.name || 'a cozy treat'} instead!`
            : `Bundle Boost: Keep it up, ${displayKidName}! Selling 2+ items together unlocks the Bundle Master badge!`,
          `Live Weather (${liveWeatherReport.locationLabel}): ${liveWeatherReport.todayVerdict}`,
          `Goal Sign Trick: Write "Saving $${financialGoal} for ${displayGoalItem}!" on a bright sign!`

        return {
          catObj,
          weatherObj,
          dowObj,
          seasonFit,
          avgSellingPrice,
          avgUnitCost,
          bestPrice,
          recommendedPrice,
          priceAction,
          projectedProfitLift,
          bestPredictedDailyUnits: Math.round(bestPredictedDailyUnits),
          currentPredDailyUnits,
          tomorrowPredictedUnits,
          logDaysCount,
          totalLoggedUnits,
          currentPredTotalRevenue,
          persistencePredUnits,
          explainabilityFactors,
          failureCases,
          verdict,
          tips
        };
      }, [
        category,
        durationDays,
        materialCost,
        products,
        totalTargetRevenue,
        displayKidName,
        financialGoal,
        displayGoalItem,
        mlEngine,
        forecastWeather,
        forecastDow,
        salesLog,

      const activeMascot = MASCOTS.find((m) => m.id === mascotId) || MASCOTS[0];
      const theme = THEMES[themeId] || THEMES.mint;

      // Age-adapted helper for phrasing natural responses
      const formatByAge = (age, variants) => {

      // Natural Age-Adapted AI Chatbot with Vercel Serverless Proxy (https://seedling-lac.vercel.app/api/chat) + Product Add Flow
      const handleSendChat = async (textToSend) => {
        const cleanText = (textToSend || '').trim();

        // 1. Check if the user is answering the price for a pending product add!
        if (pendingProductToAdd) {
          const priceMatch = censoredUserText.match(/\$?\s*(\d+(?:\.\d{1,2})?)/);
          if (priceMatch) {
            const parsedPrice = parseFloat(priceMatch[1]);
            const itemToCreate = pendingProductToAdd;

            setIsAiTyping(true);
            const finalPrice = await addAiSuggestedProductToInventory(itemToCreate, parsedPrice);
            const addedReply = formatByAge(kidAgeGroup, {
              young: `Yay! I drew a cute cartoon picture of ${itemToCreate} and put it in your shop for $${finalPrice.toFixed(2)}! 🎉`,

              ...prev,

        // 2. Check if user is asking the AI to add a new product to their inventory
        const addIntentMatch = censoredUserText.match(
          /(?:add|put|create|list)\s+(?:a\s+|an\s+|some\s+)?(.+?)(?:\s+(?:to|in|into|on)\s+(?:my\s+|the\s+)?(?:inventory|menu|shop|store|register))?(?:\s+(?:for|at)\s+\$?\s*(\d+(?:\.\d{1,2})?))?$/i
        );
        const explicitInventoryMention = /(?:inventory|menu|shop|store|register)/i.test(censoredUserText);
        const explicitAddVerb = /^(?:please\s+)?(?:add|put|create|list)\b/i.test(censoredUserText);

        if (addIntentMatch && (explicitInventoryMention || explicitAddVerb)) {
          let rawItem = (addIntentMatch[1] || '')
            .replace(/\s+(?:to|in|into|on)\s+(?:my\s+|the\s+)?(?:inventory|menu|shop|store|register).*$/i, '')
            .trim();
          const inlinePriceMatch = rawItem.match(/(.+?)\s+(?:for|at)\s+\$?\s*(\d+(?:\.\d{1,2})?)$/i);
          let inlinePrice = addIntentMatch[2] ? parseFloat(addIntentMatch[2]) : null;
          if (inlinePriceMatch) {
            rawItem = inlinePriceMatch[1].trim();
            inlinePrice = parseFloat(inlinePriceMatch[2]);
          }

          if (rawItem && rawItem.length >= 2) {
            const cleanItemTitle = rawItem
              .split(/\s+/)
              .map((w) => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase())
              .join(' ');

            if (inlinePrice && !isNaN(inlinePrice) && inlinePrice > 0) {
              setIsAiTyping(true);
              const finalPrice = await addAiSuggestedProductToInventory(cleanItemTitle, inlinePrice);
              const addedReply = formatByAge(kidAgeGroup, {
                young: `Yay! I drew a cute cartoon picture of ${cleanItemTitle} and added it to your inventory for $${finalPrice.toFixed(2)}! 🎉`,

                tween: `Added ${cleanItemTitle} to your inventory for $${finalPrice.toFixed(2)} with a custom cartoon sticker!`,
                teen: `${cleanItemTitle} has been added to your inventory at $${finalPrice.toFixed(2)} along with a generated cartoon graphic.`
              });
              setChatMessages((prev) => [
                ...prev,
                { id: `ai-${Date.now()}-${Math.random()}`, role: 'ai', text: addedReply }
              ]);
              setIsAiTyping(false);
              return;
            } else {
              // Always ask for the price first!
              setPendingProductToAdd(cleanItemTitle);
              const askPriceReply = formatByAge(kidAgeGroup, {
                young: `Ooh, ${cleanItemTitle} sounds super fun! How much money should each ${cleanItemTitle} cost?`,
                kid: `Awesome idea! How much do you want to charge for ${cleanItemTitle}? Once you tell me the price, I'll draw its cartoon sticker and add it!`,
                tween: `Great choice! What price would you like to set for ${cleanItemTitle}? Tell me the price and I'll generate its cartoon image and add it to your inventory.`,
                teen: `Sure—what unit price should I list ${cleanItemTitle} for? Let me know and I'll generate its cartoon graphic and add it to your inventory.`
              });
              setChatMessages((prev) => [
                ...prev,
                { id: `ai-${Date.now()}-${Math.random()}`, role: 'ai', text: askPriceReply }
              ]);
              return;
            }
          }
        }

        setIsAiTyping(true);

        const ageToneInstruction =
          kidAgeGroup === '6-7'
            ? 'Speak to a 6-7 year old: use super simple, playful, short sentences and easy words.'
            : kidAgeGroup === '8-9'
            ? 'Speak to an 8-9 year old: use friendly, upbeat everyday kid language with clear examples.'
            : kidAgeGroup === '10-12'
            ? 'Speak to a 10-12 year old: use an encouraging junior-CEO tone introducing real business terms naturally.'
            : 'Speak to a 13+ teen founder: use sharp, practical startup and data-science language.';

        const topSellingSummary =
          salesLog.length > 0
            ? salesLog
                .slice(0, 5)
                .map((tx) => `Day ${tx.day}: ${tx.itemsSummary} ($${tx.total.toFixed(2)})`)
                .join(' | ')
            : 'No sales recorded yet';

        const fullInventorySummary =
          products.length > 0
            ? products
                .map(
                  (p) =>
                    `[#${p.barcode}] ${p.name}: sell $${p.price.toFixed(2)}, cost $${p.unitCost.toFixed(2)}, profit/item $${(p.price - p.unitCost).toFixed(2)}`
                )
                .join('; ')
            : 'No products in inventory yet';

        const todayDateString = new Date().toLocaleDateString('en-US', {
          weekday: 'long',
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        });

        const systemPrompt = `You are ${activeMascot.shortName}, a genuine, friendly, down-to-earth human-sounding business mentor inside the Seedling app (${SITE_BASE_URL}).
${ageToneInstruction}
CRITICAL CONVERSATION RULES:
- Talk like a real, helpful person—NEVER recite raw stats in parentheses like "(2 SKUs, $0.00 revenue, $-50.00 net profit)" unless asked!
- Always directly answer the user's actual question using common sense + their real shop data below.
- If the user asks what they should sell today from their inventory, compare the actual items they have in stock against today's date (${todayDateString}) and live weather (${liveWeatherReport.todayTemp}°F in ${liveWeatherReport.locationLabel}), and recommend the best item(s) with a natural explanation!
- Only bring up weather when relevant to their question (like deciding what to sell today, outdoor setup, or seasonal items).
- Keep replies warm, natural, and concise (2-4 sentences). Stay 100% G-rated.

FULL LIVE WEBSITE & SHOP CONTEXT:
- Today's Date: ${todayDateString}
- Current Page/Tab Open: "${activeTab}" (Tabs: Home, Goal & Menu, AI Coach & ML, Cash Register, Tycoon Board)
- Founder: ${displayKidName} (Age group: ${kidAgeGroup}) | Location: ${liveWeatherReport.locationLabel}
- Live Weather Today: ${liveWeatherReport.todayTemp}°F — ${liveWeatherReport.todayVerdict}
- Shop Name: "${displayShopName}" | Status: ${shopOpen ? 'OPEN' : 'CLOSED'} | Selling Day ${activeDay} of ${durationDays}
- Savings Goal: $${financialGoal} for "${displayGoalItem}" | Supply Costs: $${materialCost} | Break-Even: $${breakEvenPoint.toFixed(2)} | Total Target: $${totalTargetRevenue.toFixed(2)} | Daily Target: $${dailySalesTarget.toFixed(2)}/day
- Money Earned So Far: Total Revenue = $${totalRevenueEarned.toFixed(2)} | Net Profit = $${netProfitEarned.toFixed(2)} (${hasBrokenEven ? 'Supplies paid off!' : `$${Math.max(0, breakEvenPoint - totalRevenueEarned).toFixed(2)} left to break even`})
- Tycoon Gems: ${tycoonGems} | Earned Badges: ${earnedBadges.length > 0 ? earnedBadges.join(', ') : 'None yet'}
- 3-Jar Profit Split: Goal ${jarAllocations.goal}%, Next Supplies ${jarAllocations.supplies}%, Charity ${jarAllocations.charity}%
- Complete Inventory (${products.length} items): ${fullInventorySummary}
- Recent Sales Log (${salesLog.length} orders): ${topSellingSummary}
- ML Forecast: Recommended price $${pennyAnalysis.recommendedPrice.toFixed(2)} (${pennyAnalysis.priceAction}); Tomorrow projected units = ${pennyAnalysis.tomorrowPredictedUnits}.`;

        let replyText = '';
        // Call Vercel Serverless Proxy (/api/chat) to avoid browser CORS errors
        const ollamaPayload = JSON.stringify({
          model: OLLAMA_MODEL_NAME,
          messages: [
            { role: 'system', content: systemPrompt },
            ...chatMessages.slice(-6).map((m) => ({
              role: m.role === 'user' ? 'user' : 'assistant',
              content: censorKidSafeText(m.text)
            })),
            { role: 'user', content: censoredUserText }
          ]
        });

        try {
          const controller = new AbortController();

        // 2. Natural Human-Sounding Fallback (Full Website, Inventory, Date & Weather Aware)
        if (!replyText) {
          setAiEngineStatus('AI Coach Ready');
          const lower = censoredUserText.toLowerCase();

          const hotDrinks = products.filter((p) =>

          );

          );

          // Question: "What should I sell today / from my inventory?"
          if (
            (lower.includes('what') || lower.includes('which') || lower.includes('recommend') || lower.includes('best')) &&

          ) {

                young: `You don't have anything on your shelf yet! Tell me what you want to make—like cookies or hot cocoa—and I'll add it for you!`,
                kid: `Your inventory is empty right now, ${displayKidName}! Tell me an item you'd like to sell (like "add cookies") and we'll get your menu started.`,
                tween: `You don't have any items in your inventory yet, ${displayKidName}. Tell me what you want to sell and I'll add it to your menu!`,

              });
            } else if (isColdOut && hotDrinks.length > 0 && coldDrinks.length > 0) {

              const cold = coldDrinks[0];

                young: `Definitely sell your ${hot.name} today! Since it's ${tempF}°F outside on ${todayDateString}, people will want something warm instead of ${cold.name}!`,

                teen: `With it being ${tempF}°F on ${todayDateString} in ${liveWeatherReport.locationLabel}, push ${hot.name} ($${hot.price.toFixed(2)}, $${(hot.price - hot.unitCost).toFixed(2)} margin) today—cool weather drives way stronger demand for warm drinks than ${cold.name}.`
              });
            } else if (!isColdOut && coldDrinks.length > 0 && hotDrinks.length > 0) {
              const cold = coldDrinks[0];
              const hot = hotDrinks[0];

                young: `Sell your ${cold.name} today! It's ${tempF}°F outside, so people will love a cold treat way more than ${hot.name}!`,

          } else if (lower.includes('weather') || lower.includes('outside') || lower.includes('rain') || lower.includes('cold') || lower.includes('hot')) {

              pennyAnalysis.seasonFit.suggestedItems.length > 0
                ? ` For ${tempF}°F weather, great items to feature are ${pennyAnalysis.seasonFit.suggestedItems.map((i) => i.name).join(', ')}.`

            replyText = formatByAge(kidAgeGroup, {

          } else if (lower.includes('sales') || lower.includes('profit') || lower.includes('earned') || lower.includes('money') || lower.includes('goal') || lower.includes('progress') || lower.includes('make')) {

            const profitStatus =
              netProfitEarned >= 0

              teen: `You've generated $${totalRevenueEarned.toFixed(2)} across ${salesLog.length} orders, so ${profitStatus}. You need $${leftToGoal} more to hit your $${totalTargetRevenue.toFixed(2)} total target for ${displayGoalItem}.`
            });
          } else if (lower.includes('badge') || lower.includes('gem') || lower.includes('jar') || lower.includes('website') || lower.includes('how') || lower.includes('help')) {
            replyText = formatByAge(kidAgeGroup, {
              young: `You have ${tycoonGems} Tycoon Gems! Sell 2 yummy things at once in the Cash Register to win the Bundle Master badge!`,

              tween: `In Seedling, you can manage products in Goal & Menu, forecast demand in AI Coach & ML, ring up bundles for +10 Tycoon Gems in Cash Register, and split profits into your 3 Jars (${jarAllocations.goal}% Goal / ${jarAllocations.supplies}% Supplies / ${jarAllocations.charity}% Charity).`,
              teen: `Seedling connects your full shop workflow: Menu & margins (Goal & Menu), Random Forest demand forecasting (AI Coach & ML), POS checkout with bundle detection (+10 Gems), and 3-Jar profit splits (${jarAllocations.goal}/${jarAllocations.supplies}/${jarAllocations.charity}).`
            });
          } else if (lower.includes('price') || lower.includes('cost') || lower.includes('charge')) {
            replyText = formatByAge(kidAgeGroup, {
              young: `Charging around $${pennyAnalysis.recommendedPrice.toFixed(2)} is a super smart price for your shop!`,
              kid: `My smart pricing math suggests $${pennyAnalysis.recommendedPrice.toFixed(2)} (${pennyAnalysis.priceAction}) to help you earn more profit!`,
              tween: `Based on customer demand and your supply costs ($${pennyAnalysis.avgUnitCost.toFixed(2)} avg), pricing near $${pennyAnalysis.recommendedPrice.toFixed(2)} (${pennyAnalysis.priceAction}) gives you the best profit.`,
              teen: `Elasticity modeling recommends $${pennyAnalysis.recommendedPrice.toFixed(2)} (${pennyAnalysis.priceAction}) against your $${pennyAnalysis.avgUnitCost.toFixed(2)} average unit cost.`
            });
          } else if (lower.includes('predict') || lower.includes('tomorrow') || lower.includes('forecast')) {
            replyText = formatByAge(kidAgeGroup, {
              young: `I think you can sell about ${pennyAnalysis.tomorrowPredictedUnits} things tomorrow! Yay!`,
              kid: `My ML forecaster predicts about ${pennyAnalysis.tomorrowPredictedUnits} sales tomorrow based on your shop data!`,
              tween: `Combining your sales logs with our Random Forest model, I project about ${pennyAnalysis.tomorrowPredictedUnits} units sold tomorrow.`,
              teen: `Our Random Forest model forecasts ${pennyAnalysis.tomorrowPredictedUnits} units tomorrow (MAE ${mlEngine.rfMAE} vs. ${mlEngine.baseMAE} persistence baseline).`
            });
          } else if (lower.includes('sign') || lower.includes('poster') || lower.includes('idea') || lower.includes('bundle')) {
            replyText = formatByAge(kidAgeGroup, {
              young: `Make a bright sign that says: "Welcome to ${displayShopName}! Help me buy ${displayGoalItem}!"`,
              kid: `Try a "Bestie Bundle" (2 items together) at the Cash Register to earn the Bundle Master badge, and put up a sign for your $${financialGoal} ${displayGoalItem} goal!`,
              tween: `Promote a 2-item combo deal to boost your average order value and unlock the Bundle Master badge, plus highlight your $${financialGoal} ${displayGoalItem} goal on your stand sign!`,
              teen: `Bundling 2+ items increases average order value and unlocks the Bundle Master bonus (+10 Gems), while goal-driven signage improves conversion.`
            });
          } else if (/^(hi|hello|hey|yo|sup|how are you)/i.test(lower)) {
            replyText = formatByAge(kidAgeGroup, {
              young: `Hiya ${displayKidName}! Welcome to ${displayShopName}! What do you want to work on today?`,
              kid: `Hey ${displayKidName}! Good to see you at ${displayShopName}. Want help picking what to sell today, adding a new item, or checking your goal progress?`,
              tween: `Hey ${displayKidName}! Welcome back to ${displayShopName} on ${todayDateString}. How can I help with your shop today?`,
              teen: `Hey ${displayKidName}! ${displayShopName} is ready for ${todayDateString}. Want to look at what to feature today, pricing, or your sales pace?`
            });
          } else {
            replyText = formatByAge(kidAgeGroup, {
              young: `Got it, ${displayKidName}! You're saving up for ${displayGoalItem}—ask me what to sell today, how much money you've made, or tell me to add a new item!`,
              kid: `I'm here to help with ${displayShopName}, ${displayKidName}! You can ask me what to sell today, how your money and goal are looking, or tell me to add a new product to your menu.`,
              tween: `Happy to help with ${displayShopName}, ${displayKidName}! Ask me which item fits today's weather best, how close you are to your ${displayGoalItem} goal, or tell me to add a new product.`,
              teen: `Got it, ${displayKidName}. Ask me what to prioritize in ${displayShopName} today, how your margins and goal progress look, or tell me to add a new product.`
            });
          }
        }

        setChatMessages((prev) => [
          ...prev,
          { id: `ai-${Date.now()}-${Math.random()}`, role: 'ai', text: censorKidSafeText(replyText) }
        ]);
        setIsAiTyping(false);
      };

      // POS Functions
      const addItemToCart = (product) => {
        playScannerBeep(soundMuted);
        setCart((prev) => {
          const existing = prev.find((item) => item.id === product.id);
          if (existing) {
            return prev.map((item) =>
              item.id === product.id ? { ...item, qty: item.qty + 1 } : item
            );
          }
          return [...prev, { ...product, qty: 1 }];
        });
      };

      const handleBarcodeSubmit = (codeToScan) => {
        const cleanCode = (codeToScan || barcodeInput).trim().padStart(3, '0');
        const found = products.find((p) => p.barcode === cleanCode);
        if (found) {
          addItemToCart(found);
          setBarcodeInput('');
          setPosBanner({
            type: 'success',
            text: `Scanned [${found.barcode}] ${found.name} (+$${found.price.toFixed(2)})`
          });
        } else {
          setPosBanner({
            type: 'error',
            text:
              products.length === 0
                ? 'Your inventory is empty! Add products first.'
                : `Barcode "${codeToScan || barcodeInput}" not found! Try 001–00${products.length}.`
          });
        }
        setTimeout(() => setPosBanner(null), 2600);
      };

      const updateCartQty = (id, delta) => {
        setCart((prev) =>
          prev
            .map((item) => (item.id === id ? { ...item, qty: item.qty + delta } : item))
            .filter((item) => item.qty > 0)
        );
      };

      const cartItemsTotal = useMemo(
        () => Number(cart.reduce((sum, item) => sum + item.price * item.qty, 0).toFixed(2)),
        [cart]
      );

      const cartSubtotal = Number((cartItemsTotal + Number(tipAmount || 0)).toFixed(2));

      const cartCostTotal = useMemo(
        () => Number(cart.reduce((sum, item) => sum + item.unitCost * item.qty, 0).toFixed(2)),
        [cart]
      );

      const changeDue = useMemo(() => {
        const paid = parseFloat(cashTendered);
        if (isNaN(paid) || paid < cartSubtotal) return null;
        return Number((paid - cartSubtotal).toFixed(2));
      }, [cashTendered, cartSubtotal]);

      const completeSale = () => {
        if (cart.length === 0) return;
        playKaChingSound(soundMuted);

        const distinctCount = cart.length;
        const unitsCount = cart.reduce((sum, i) => sum + i.qty, 0);
        const isBundleSale = distinctCount >= 2 || unitsCount >= 3;

        const itemsSummary =
          cart.map((i) => `${i.qty}x ${i.name}`).join(', ') +
          (tipAmount > 0 ? ` (+$${tipAmount.toFixed(2)} Tip)` : '');
        const now = new Date();
        const timestamp = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        const newTx = {
          id: `tx-${Date.now()}`,
          day: activeDay,
          timestamp,
          itemsSummary,
          unitsCount,
          tip: Number(tipAmount || 0),
          total: cartSubtotal,
          profit: Number((cartSubtotal - cartCostTotal).toFixed(2))
        };

        setSalesLog((prev) => [newTx, ...prev]);
        setTycoonGems((g) => g + (isBundleSale ? 10 : 5));

        if (isBundleSale) {
          setShowConfetti(true);
          setEarnedBadges((prev) =>
            prev.includes('Bundle Master') ? prev : [...prev, 'Bundle Master']
          );
          setTimeout(() => setShowConfetti(false), 3800);
        }

        setCart([]);
        setTipAmount(0);
        setCashTendered('');
        setPosBanner({
          type: 'success',
          text: isBundleSale
            ? `🎉 BUNDLE MASTER! +$${cartSubtotal.toFixed(2)} logged & +10 Tycoon Gems!`
            : `Ka-Ching! +$${cartSubtotal.toFixed(2)} logged & +5 Tycoon Gems earned!`
        });
        setTimeout(() => setPosBanner(null), 3800);
      };

      if (isLocked && accountPassword) {
        return (
          <div className={`min-h-screen ${theme.bg} ${theme.text} flex items-center justify-center p-4`}>
            <div className={`max-w-md w-full ${theme.card} border-2 ${theme.cardShadow} rounded-3xl p-7 text-center space-y-5`}>
              <div className="flex justify-center">
                <PixelMascot type={activeMascot.id} size={76} circular />
              </div>
              <div>
                <span className={`px-3 py-1 rounded-full text-xs font-black border ${theme.accentBadge}`}>
                  🔒 Shop Protected
                </span>
                <h1 className="text-2xl font-black mt-2">{displayShopName}</h1>
                <p className={`text-xs mt-1 ${theme.mutedText}`}>
                  Enter your password ({parentContact}) to unlock {displayKidName}’s shop.
                </p>
              </div>
              <form
                onSubmit={(e) => {
                  e.preventDefault();
                  if (loginPasswordInput === accountPassword) {
                    setIsLocked(false);
                    setLoginPasswordInput('');
                    setLoginError('');
                  } else {
                    setLoginError('Wrong password! Try again.');
                  }
                }}
                className="space-y-3"
              >
                <input
                  type="password"
                  value={loginPasswordInput}
                  onChange={(e) => setLoginPasswordInput(e.target.value)}
                  placeholder="Enter saved password"
                  className={`w-full px-4 py-3 rounded-2xl border-2 text-sm font-bold outline-none ${theme.inputBg}`}
                />
                {loginError && <div className="text-xs font-black text-rose-500">{loginError}</div>}
                <button
                  type="submit"
                  className={`w-full py-3.5 rounded-full border-2 font-black text-sm cursor-pointer ${theme.primaryBtn}`}
                >
                  Unlock Shop →
                </button>
              </form>
            </div>
          </div>
        );
      }

      if (!hasCompletedOnboarding) {
        return (
          <OnboardingWizard
            step={onboardingStep}
            setStep={setOnboardingStep}
            kidName={kidName}
            setKidName={setKidName}

            cityLocation={cityLocation}
            setCityLocation={setCityLocation}

            setParentKnows={setParentKnows}

            setContactMethod={setContactMethod}

      const goalProgressPct =
        totalTargetRevenue > 0

      return (
        <div className={`min-h-screen ${theme.bg} ${theme.text} flex flex-col justify-between transition-colors`}>

            <header className="max-w-7xl mx-auto px-4 sm:px-6 pt-3 pb-2 flex flex-wrap items-center justify-between gap-2">
              <button
                onClick={() => setActiveTab('home')}

              >
                <PixelLogo size={38} />
                <div className="text-left">

                </div>

                {accountPassword && (
                  <button

            {/* Mint-Teal Hero Banner */}

                  kidName={displayKidName}

                  setBusinessName={setBusinessName}

                  products={products}
                  pennyAnalysis={pennyAnalysis}
                  liveWeatherReport={liveWeatherReport}
                  chatMessages={chatMessages}
                  isAiTyping={isAiTyping}
                  onSendChat={handleSendChat}
                  onNavigate={setActiveTab}
                  onCloseShopForToday={() => {
                    setShopOpen(false);
                    setShowShiftWrapUp(true);
                  }}
                />
              )}

              {activeTab === 'setup' && (
                <GoalSetupPage
                  theme={theme}
                  businessName={businessName}
                  setBusinessName={setBusinessName}
                  category={category}
                  setCategory={setCategory}
                  goalItemName={goalItemName}
                  setGoalItemName={setGoalItemName}
                  financialGoal={financialGoal}
                  setFinancialGoal={setFinancialGoal}
                  durationDays={durationDays}
                  setDurationDays={setDurationDays}
                  materialCost={materialCost}
                  setMaterialCost={setMaterialCost}
                  totalTargetRevenue={totalTargetRevenue}
                  dailySalesTarget={dailySalesTarget}
                  breakEvenPoint={breakEvenPoint}
                  products={products}
                  setProducts={setProducts}
                  onNext={() => setActiveTab('coach')}
                  onBackHome={() => setActiveTab('home')}
                />
              )}

              {activeTab === 'coach' && (
                <PennyCoachPage
                  theme={theme}
                  activeMascot={activeMascot}
                  businessName={displayShopName}
                  goalItemName={displayGoalItem}
                  mlEngine={mlEngine}
                  pennyAnalysis={pennyAnalysis}
                  liveWeatherReport={liveWeatherReport}
                  forecastDow={forecastDow}
                  setForecastDow={setForecastDow}
                  aiEngineStatus={aiEngineStatus}
                  chatMessages={chatMessages}
                  isAiTyping={isAiTyping}
                  onSendChat={handleSendChat}
                  onAddSuggestedItem={async (item) => {
                    await addAiSuggestedProductToInventory(item.name, item.price, item.unitCost);
                  }}
                  onApplyOptimalPrice={() => {
                    setProducts((prev) =>
                      prev.map((p, idx) =>
                        idx === 0 ? { ...p, price: pennyAnalysis.recommendedPrice } : p
                      )
                    );
                  }}
                  onNext={() => setActiveTab('pos')}
                  onBackHome={() => setActiveTab('home')}
                />

              {activeTab === 'pos' && (
                <RegisterPOSPage
                  theme={theme}
                  businessName={displayShopName}
                  products={products}
                  setProducts={setProducts}

    // ============================================================================

    function GoalSetupPage({
      theme,
      businessName,
      setBusinessName,
      category,
      setCategory,
      goalItemName,
      setGoalItemName,
      financialGoal,
      setFinancialGoal,
      durationDays,
      setDurationDays,
      materialCost,
      setMaterialCost,
      totalTargetRevenue,
      dailySalesTarget,
      breakEvenPoint,
      products,
      setProducts,
      onNext,
      onBackHome
    }) {
      const [newItemName, setNewItemName] = useState('');
      const [newItemPrice, setNewItemPrice] = useState('');
      const [newItemCost, setNewItemCost] = useState('');
      const [isGeneratingImg, setIsGeneratingImg] = useState(false);
      const [itemError, setItemError] = useState('');

      const handleAddProduct = async (e) => {
        e.preventDefault();
        if (isGeneratingImg) return;
        setItemError('');

        const rawName = newItemName.trim();
        const priceNum = parseFloat(newItemPrice);
        const costNum = parseFloat(newItemCost) || 0.25;

        if (!rawName || isNaN(priceNum) || priceNum <= 0) {
          setItemError('Enter an item name and selling price!');
          return;
        }
        if (containsProfanity(rawName)) {
          setItemError('Keep product names friendly for all customers!');
          return;
        }

        const cleanName = censorKidSafeText(rawName);
        setIsGeneratingImg(true);
        const aiCartoonUrl = await generateCartoonProductImage(cleanName);

        const nextBarcode = String(products.length + 1).padStart(3, '0');
        setProducts((prev) => [
          ...prev,
          {
            id: `prod-${Date.now()}`,
            barcode: nextBarcode,
            name: cleanName,
            price: Number(priceNum.toFixed(2)),
            unitCost: Number(costNum.toFixed(2)),
            imageUrl: aiCartoonUrl,
            emoji: '🛍️'
          }
        ]);

        setNewItemName('');
        setNewItemPrice('');
        setNewItemCost('');
        setIsGeneratingImg(false);
      };

      const handleDeleteProduct = (id) => {
        setProducts((prev) =>
          prev
            .filter((item) => item.id !== id)
            .map((item, idx) => ({ ...item, barcode: String(idx + 1).padStart(3, '0') }))
        );
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">

                onClick={onBackHome}

                <ArrowLeft className="w-3.5 h-3.5" />
                <span>Back to Home Hub</span>
              </button>
              <h1 className="text-2xl sm:text-3xl font-black">Smart Goal & Menu Builder</h1>
            </div>

            <button
              onClick={onNext}
              className={`inline-flex items-center justify-center gap-2 px-5 py-3 rounded-full border-2 font-black text-sm cursor-pointer ${theme.primaryBtn}`}
            >
              <span>Ask AI Coach</span>
              <ArrowRight className="w-4 h-4" />

              <div className="space-y-3">
                <div>
                  <label className="block text-xs font-extrabold mb-1">Business Name</label>
                  <input
                    type="text"
                    value={businessName}
                    onChange={(e) => setBusinessName(censorKidSafeText(e.target.value))}
                    placeholder="My Pop-Up Shop"
                    className={`w-full px-3.5 py-2.5 rounded-2xl border-2 text-sm font-bold ${theme.inputBg}`}
                  />
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-extrabold mb-1">Category</label>

                      value={category}
                      onChange={(e) => setCategory(e.target.value)}

                    <label className="block text-xs font-extrabold mb-1">Saving Up For</label>

                            <img

                              alt={prod.name}
                              className="w-full h-full object-cover rounded-xl"

                          <span className="text-3xl">{prod.emoji || '🛍️'}</span>

                          <div className="font-black text-sm">{prod.name}</div>
                          <div className={`text-[11px] ${theme.mutedText}`}>
                            Supply cost: ${prod.unitCost.toFixed(2)}
                          </div>
                        </div>
                      </div>
                      <div className="flex items-center gap-2">
                        <div className="flex items-center gap-1">
                          <span className="text-xs font-black text-emerald-500">$</span>
                          <input
                            type="number"
                            step="0.25"
                            min="0.25"
                            value={prod.price}

    // ============================================================================
    // MODULE 4: TYCOON PROGRESS DASHBOARD

    function TycoonDashboardPage({
      theme,
      businessName,
      goalItemName,
      financialGoal,
      totalTargetRevenue,
      dailySalesTarget,
      breakEvenPoint,
      totalRevenueEarned,
      netProfitEarned,
      hasBrokenEven,
      hasReachedGoal,
      durationDays,
      activeDay,
      setActiveDay,
      salesLog,
      onOpenShiftWrapUp,
      onAddQuickDemoSale,
      onGoRegister,
      onBackHome
    }) {
      const breakEvenPct =
        breakEvenPoint > 0
          ? Math.min(100, Math.round((totalRevenueEarned / breakEvenPoint) * 100))
          : totalRevenueEarned > 0
          ? 100
          : 0;
      const totalGoalPct =
        totalTargetRevenue > 0
          ? Math.min(100, Math.round((totalRevenueEarned / totalTargetRevenue) * 100))
          : 0;

      const chartDays = Array.from({ length: durationDays }, (_, idx) => {
        const dayNum = idx + 1;
        const targetCumulative = Number((dailySalesTarget * dayNum).toFixed(2));
        const actualCumulative = Number(
          salesLog
            .filter((tx) => tx.day <= dayNum)
            .reduce((sum, tx) => sum + tx.total, 0)
            .toFixed(2)
        );
        return {
          day: dayNum,
          targetCumulative,
          actualCumulative: dayNum <= activeDay ? actualCumulative : null
        };
      });

      const maxY = Math.max(totalTargetRevenue, totalRevenueEarned, 10) * 1.15;
      const svgW = 540;
      const svgH = 220;
      const padL = 48;
      const padR = 24;
      const padT = 22;
      const padB = 34;
      const plotW = svgW - padL - padR;
      const plotH = svgH - padT - padB;

      const getX = (idx) =>
        chartDays.length <= 1 ? padL + plotW / 2 : padL + (idx / (chartDays.length - 1)) * plotW;
      const getY = (val) => padT + plotH - (val / maxY) * plotH;

      const targetPoints = chartDays.map((d, i) => `${getX(i)},${getY(d.targetCumulative)}`).join(' ');
      const activePoints = chartDays
        .filter((d) => d.actualCumulative !== null)
        .map((d, i) => `${getX(i)},${getY(d.actualCumulative)}`)
        .join(' ');

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <button
                onClick={onBackHome}
                className={`inline-flex items-center gap-1.5 text-xs font-extrabold px-3 py-1 rounded-full border mb-2 cursor-pointer ${theme.pillBg}`}
              >
                <ArrowLeft className="w-3.5 h-3.5" />
                <span>Back to Home Hub</span>
              </button>
              <h1 className="text-2xl sm:text-3xl font-black">{businessName} — Tycoon Board</h1>
            </div>

            <div className="flex flex-wrap items-center gap-2">
              <button
                onClick={onOpenShiftWrapUp}
                className={`inline-flex items-center gap-1.5 px-4 py-2.5 rounded-full border-2 font-black text-xs cursor-pointer ${theme.secondaryBtn}`}
              >
                <span>🌙 Close Shop & Split Profit Jars</span>
              </button>
              <button
                onClick={onGoRegister}
                className={`inline-flex items-center gap-1.5 px-4 py-2.5 rounded-full border-2 font-black text-xs cursor-pointer ${theme.primaryBtn}`}
              >
                <ScanBarcode className="w-4 h-4" />
                <span>Cash Register</span>
              </button>
            </div>
          </div>

          <div className="grid grid-cols-2 lg:grid-cols-4 gap-3.5">
            <div className={`${theme.card} border-2 ${theme.cardShadow} rounded-3xl p-4`}>
              <div className={`text-xs font-bold ${theme.mutedText}`}>Total Collected</div>
              <div className="text-2xl font-black mt-1">${totalRevenueEarned.toFixed(2)}</div>
            </div>
            <div className={`${theme.card} border-2 ${theme.cardShadow} rounded-3xl p-4`}>
              <div className={`text-xs font-bold ${theme.mutedText}`}>Supply Break-Even</div>
              <div className="text-2xl font-black text-amber-500 mt-1">${breakEvenPoint.toFixed(2)}</div>
            </div>
            <div className={`${theme.card} border-2 ${theme.cardShadow} rounded-3xl p-4`}>
              <div className={`text-xs font-bold ${theme.mutedText}`}>Net Profit</div>
              <div
                className={`text-2xl font-black mt-1 ${
                  netProfitEarned >= 0 ? 'text-emerald-500' : 'text-rose-500'
                }`}
              >
                {netProfitEarned >= 0
                  ? `+$${netProfitEarned.toFixed(2)}`
                  : `-$${Math.abs(netProfitEarned).toFixed(2)}`}
              </div>
            </div>
            <div className={`${theme.card} border-2 ${theme.cardShadow} rounded-3xl p-4`}>
              <div className={`text-xs font-bold ${theme.mutedText}`}>Goal ({goalItemName})</div>
              <div className="text-2xl font-black text-sky-500 mt-1">${Number(financialGoal).toFixed(2)}</div>
            </div>
          </div>

          <div
            className={`rounded-3xl p-6 border-2 transition-colors ${
              hasBrokenEven
                ? 'bg-emerald-500/15 border-emerald-500'
                : `${theme.card} ${theme.cardShadow}`
            }`}
          >
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3">
              <div>
                <span
                  className={`text-xs font-black uppercase tracking-wider px-3 py-1 rounded-full ${
                    hasBrokenEven ? 'bg-emerald-500 text-slate-950' : 'bg-amber-400 text-slate-950'
                  }`}
                >
                  {hasReachedGoal
                    ? `🎉 Goal Reached! Ready to Buy ${goalItemName}!`
                    : hasBrokenEven
                    ? '🚀 PROFIT ZONE UNLOCKED! Supplies Paid Off!'
                    : `⏳ Break-Even Journey: $${Math.max(0, breakEvenPoint - totalRevenueEarned).toFixed(2)} Left`}
                </span>
              </div>
              <div className="text-xs font-extrabold">
                Break-Even: <strong>{breakEvenPct}%</strong> • Overall Goal:{' '}
                <strong>{totalGoalPct}%</strong>
              </div>
            </div>

            <div className="w-full h-7 bg-white/85 rounded-full overflow-hidden border border-black/10 p-1">
              <div
                className={`h-full rounded-full transition-all duration-500 ${
                  hasBrokenEven ? 'bg-emerald-500' : 'bg-amber-400'
                }`}
                style={{ width: `${Math.max(4, totalGoalPct)}%` }}
              />
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div
              className={`lg:col-span-7 ${theme.card} border-2 ${theme.cardShadow} rounded-3xl p-6 space-y-4`}
            >
              <div className="flex flex-wrap items-center justify-between gap-2">
                <div>
                  <h2 className="text-base font-black">Cumulative Earnings vs. Daily Target</h2>
                  <p className={`text-xs ${theme.mutedText}`}>
                    Solid line = Actual earnings • Dashed line = Target pace (${dailySalesTarget.toFixed(2)}/day)
                  </p>
                </div>
                <div className="flex items-center gap-1.5">
                  <span className="text-xs font-bold">Active Day:</span>
                  <select
                    value={activeDay}
                    onChange={(e) => setActiveDay(Number(e.target.value))}
                    className={`px-2.5 py-1 rounded-full border text-xs font-black ${theme.inputBg}`}
                  >
                    {Array.from({ length: durationDays }, (_, i) => i + 1).map((d) => (
                      <option key={d} value={d}>
                        Day {d}
                      </option>
                    ))}
                  </select>
                </div>
              </div>

              <div className={`w-full overflow-x-auto rounded-2xl p-3 border ${theme.innerCream}`}>
                <svg viewBox={`0 0 ${svgW} ${svgH}`} className="w-full h-auto">
                  {[0, 0.5, 1].map((ratio, idx) => {
                    const val = maxY * ratio;
                    const y = getY(val);
                    return (
                      <g key={idx}>
                        <line
                          x1={padL}
                          y1={y}
                          x2={svgW - padR}
                          y2={y}
                          stroke="currentColor"
                          strokeOpacity="0.18"
                          strokeDasharray="4 4"
                        />
                        <text
                          x={padL - 8}
                          y={y + 4}
                          textAnchor="end"
                          fontSize="11"
                          fill="currentColor"
                          opacity="0.78"
                          fontWeight="bold"
                        >
                          ${Math.round(val)}
                        </text>
                      </g>
                    );
                  })}

                  <line
                    x1={padL}
                    y1={getY(breakEvenPoint)}
                    x2={svgW - padR}
                    y2={getY(breakEvenPoint)}
                    stroke="#F59E0B"
                    strokeWidth="2"
                    strokeDasharray="3 3"
                  />

                  <polyline
                    fill="none"
                    stroke="#0EA5E9"
                    strokeWidth="3"
                    strokeDasharray="6 4"
                    points={targetPoints}
                  />

                  {activePoints && (
                    <polyline
                      fill="none"
                      stroke="#10B981"
                      strokeWidth="4"
                      strokeLinecap="round"
                      strokeLinejoin="round"
                      points={activePoints}
                    />
                  )}

                  {chartDays.map((d, i) => (
                    <g key={d.day}>
                      <circle cx={getX(i)} cy={getY(d.targetCumulative)} r="4" fill="#0EA5E9" />
                      {d.actualCumulative !== null && (
                        <circle
                          cx={getX(i)}
                          cy={getY(d.actualCumulative)}
                          r="6"
                          fill="#10B981"
                          stroke="#FFFFFF"
                          strokeWidth="2"
                        />
                      )}
                      <text
                        x={getX(i)}
                        y={svgH - 10}
                        textAnchor="middle"
                        fontSize="11"
                        fill="currentColor"
                        opacity="0.82"
                        fontWeight="bold"
                      >
                        Day {d.day}
                      </text>
                    </g>
                  ))}
                </svg>
              </div>
            </div>

            <div
              className={`lg:col-span-5 ${theme.card} border-2 ${theme.cardShadow} rounded-3xl p-6 flex flex-col justify-between space-y-4`}
            >
              <div className="space-y-3">
                <div className="flex items-center justify-between">
                  <h2 className="text-base font-black">Recent Sales Log</h2>
                  <span className={`text-xs font-extrabold px-2.5 py-0.5 rounded-full border ${theme.pillBg}`}>
                    {salesLog.length} Sales

                </div>

                {salesLog.length === 0 ? (
                  <div className={`p-6 rounded-2xl border border-dashed text-center space-y-1 ${theme.innerCream}`}>
                    <div className="text-2xl">📊</div>
                    <div className="font-black text-sm">No Sales Logged Yet</div>
                    <p className="text-xs opacity-75">
                      Ring up customers on the Cash Register to see your earnings grow!
                    </p>
                  </div>
                ) : (
                  <div className="space-y-2.5 max-h-60 overflow-y-auto pr-1">
                    {salesLog.map((tx) => (
                      <div

    // ============================================================================
    // END-OF-DAY SHIFT WRAP-UP & 3-JAR PROFIT SPLITTER MODAL
    // ============================================================================
    function ShiftWrapUpModal({
      theme,
      kidName,
      mascot,
      goalItemName,
      activeDay,
      salesLog,
      totalRevenueEarned,
      netProfitEarned,
      pennyAnalysis,
      jarAllocations,
      setJarAllocations,
      onClose,
      onStartNextDay
    }) {
      const todaySales = salesLog.filter((tx) => tx.day === activeDay);
      const todayRevenue = Number(todaySales.reduce((s, t) => s + t.total, 0).toFixed(2));
      const bestItemName =
        todaySales.length > 0
          ? todaySales[0].itemsSummary.replace(/^\d+x\s*/, '').split(',')[0]
          : 'Your Featured Item';

      const splittableMoney = Math.max(0, netProfitEarned > 0 ? netProfitEarned : totalRevenueEarned);
      const goalDollars = Number(((splittableMoney * jarAllocations.goal) / 100).toFixed(2));
      const suppliesDollars = Number(((splittableMoney * jarAllocations.supplies) / 100).toFixed(2));
      const charityDollars = Number(((splittableMoney * jarAllocations.charity) / 100).toFixed(2));

      const adjustJar = (targetJar) => {
        setJarAllocations((prev) => {
          if (targetJar === 'goal') {
            const nextGoal = Math.min(80, prev.goal + 10);
            const rem = 100 - nextGoal;
            return { goal: nextGoal, supplies: Math.round(rem * 0.67), charity: 100 - nextGoal - Math.round(rem * 0.67) };
          }
          if (targetJar === 'supplies') {
            const nextSup = Math.min(60, prev.supplies + 10);
            const nextGoal = Math.max(20, 100 - nextSup - prev.charity);
            return { goal: nextGoal, supplies: nextSup, charity: 100 - nextGoal - nextSup };
          }
          const nextChar = Math.min(40, prev.charity + 10);
          const nextGoal = Math.max(20, 100 - prev.supplies - nextChar);
          return { goal: nextGoal, supplies: prev.supplies, charity: nextChar };
        });
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/65 backdrop-blur-xs flex items-center justify-center p-4">
          <div
            className={`${theme.card} border-2 rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 sm:p-8 shadow-2xl space-y-5`}
          >
            <div className="flex items-start justify-between gap-3 border-b border-black/10 pb-4">
              <div className="flex items-center gap-3">
                <PixelMascot type={mascot.id} size={56} circular isTalking />
                <div>
                  <span
                    className={`text-[11px] font-extrabold uppercase px-2.5 py-0.5 rounded-full border ${theme.accentBadge}`}
                  >
                    End-of-Day Shift Wrap-Up
                  </span>
                  <h2 className="text-xl sm:text-2xl font-black mt-1">
                    Awesome Shift, {kidName}! (Day {activeDay})
                  </h2>
                </div>
              </div>
              <button
                onClick={onClose}
                className={`p-2 rounded-full border ${theme.pillBg} cursor-pointer`}
              >
                <X className="w-5 h-5" />
              </button>
            </div>

            <div className={`p-4 rounded-2xl border ${theme.innerCream} space-y-2 text-sm`}>
              <div className="font-black text-emerald-500 text-xs uppercase">
                {mascot.shortName}’s 3-Bullet Shift Summary
              </div>
              <ul className="space-y-1.5 font-bold text-xs sm:text-sm">
                <li>
                  ⭐ <strong>Top Seller Today:</strong> {bestItemName} ({todaySales.length} orders logged)
                </li>
                <li>
                  💰 <strong>Session Revenue & Profit:</strong> Earned ${todayRevenue.toFixed(2)} today (
                  {netProfitEarned >= 0
                    ? `+$${netProfitEarned.toFixed(2)} net profit!`
                    : `$${Math.abs(netProfitEarned).toFixed(2)} to break-even`}
                  )
                </li>
                <li>
                  🤖 <strong>Tomorrow’s ML Projection:</strong> Aim to sell{' '}
                  <strong>{pennyAnalysis.tomorrowPredictedUnits} units</strong> to stay on track for {goalItemName}!
                </li>
              </ul>
            </div>

            <div className="space-y-3">
              <div className="flex items-center justify-between">
                <h3 className="text-base font-black">🪙 3-Jar Profit Splitter (${splittableMoney.toFixed(2)})</h3>
                <div className="flex gap-1.5">
                  <button
                    type="button"
                    onClick={() => setJarAllocations({ goal: 70, supplies: 20, charity: 10 })}
                    className={`px-2.5 py-1 rounded-full border text-[11px] font-black cursor-pointer ${theme.pillBg}`}
                  >
                    70/20/10 Classic
                  </button>
                  <button
                    type="button"
                    onClick={() => setJarAllocations({ goal: 50, supplies: 30, charity: 20 })}
                    className={`px-2.5 py-1 rounded-full border text-[11px] font-black cursor-pointer ${theme.pillBg}`}
                  >
                    50/30/20 Growth
                  </button>
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 text-center">
                <div className={`p-4 rounded-2xl border-2 border-emerald-400 ${theme.innerCream} space-y-2`}>
                  <div className="text-3xl">🎯</div>
                  <div className="font-black text-sm">My Goal ({jarAllocations.goal}%)</div>
                  <div className="text-xl font-black text-emerald-500">${goalDollars.toFixed(2)}</div>
                  <p className={`text-[11px] ${theme.mutedText}`}>For {goalItemName}</p>
                  <button
                    type="button"
                    onClick={() => adjustJar('goal')}
                    className="w-full py-1.5 rounded-full bg-emerald-500 text-slate-950 font-black text-xs cursor-pointer"
                  >
                    + Drop Coin (+10%)
                  </button>
                </div>

                <div className={`p-4 rounded-2xl border-2 border-amber-400 ${theme.innerCream} space-y-2`}>
                  <div className="text-3xl">🍋</div>
                  <div className="font-black text-sm">Next Supplies ({jarAllocations.supplies}%)</div>
                  <div className="text-xl font-black text-amber-500">${suppliesDollars.toFixed(2)}</div>
                  <p className={`text-[11px] ${theme.mutedText}`}>Restock ingredients</p>
                  <button
                    type="button"
                    onClick={() => adjustJar('supplies')}
                    className="w-full py-1.5 rounded-full bg-amber-400 text-slate-950 font-black text-xs cursor-pointer"
                  >
                    + Drop Coin (+10%)
                  </button>
                </div>

                <div className={`p-4 rounded-2xl border-2 border-rose-400 ${theme.innerCream} space-y-2`}>
                  <div className="text-3xl">❤️</div>
                  <div className="font-black text-sm">Charity / Give ({jarAllocations.charity}%)</div>
                  <div className="text-xl font-black text-rose-500">${charityDollars.toFixed(2)}</div>
                  <p className={`text-[11px] ${theme.mutedText}`}>Help your community</p>
                  <button
                    type="button"
                    onClick={() => adjustJar('charity')}
                    className="w-full py-1.5 rounded-full bg-rose-400 text-slate-950 font-black text-xs cursor-pointer"
                  >
                    + Drop Coin (+10%)
                  </button>
                </div>
              </div>
            </div>

            <div className="flex flex-col sm:flex-row items-center justify-end gap-2.5 pt-2">
              <button
                type="button"
                onClick={onClose}
                className={`w-full sm:w-auto px-5 py-2.5 rounded-full border font-extrabold text-xs cursor-pointer ${theme.pillBg}`}
              >
                Save & Close
              </button>
              <button
                type="button"
                onClick={onStartNextDay}
                className={`w-full sm:w-auto px-6 py-2.5 rounded-full border-2 font-black text-xs cursor-pointer ${theme.primaryBtn}`}
              >
                Start Next Selling Day →
              </button>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

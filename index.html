    function normalizeLeetForCheck(str) {
      return str
        .toLowerCase()
        .replace(/[@4]/g, 'a')
        .replace(/[3€]/g, 'e')
        .replace(/[1!|]/g, 'i')
        .replace(/[0°]/g, 'o')
        .replace(/[$5]/g, 's')
        .replace(/[7+]/g, 't')
        .replace(/8/g, 'b')
        .replace(/9/g, 'g')
        .replace(/[^a-z\s]/g, '');
    }

    function containsProfanity(text) {
      if (!text) return false;
      const normalized = normalizeLeetForCheck(text);
      const words = normalized.split(/\s+/).filter(Boolean);
      for (const w of words) {
        if (SAFE_WHITELIST.includes(w)) continue;
        const collapsed = w.replace(/(.)\1{2,}/g, '$1');
        if (BANNED_TERMS.includes(w) || BANNED_TERMS.includes(collapsed)) return true;
        for (const bad of BANNED_TERMS) {
          if (bad.length >= 4 && (w.includes(bad) || collapsed.includes(bad))) {
            return true;
          }
        }
      }
      const squished = normalized.replace(/\s+/g, '');
      if (!SAFE_WHITELIST.some((safe) => squished.includes(safe))) {
        for (const bad of BANNED_TERMS) {
          if (bad.length >= 4 && squished.includes(bad)) return true;
        }
      }
      return false;
    }

    function censorKidSafeText(text) {
      if (!text) return '';
      return text
        .split(/(\s+)/)
        .map((token) => {
          if (!token.trim()) return token;
          return containsProfanity(token) ? '⭐'.repeat(Math.min(4, token.trim().length)) : token;
        })
        .join('');
    }

    // ========================================================================
    // LIVE EXTERNAL WEATHER FETCHER (OPEN-METEO API — EDISON, NJ DEFAULT)
    // ========================================================================
    function decodeOpenMeteoWeather(code, tempF) {
      const isRainOrStorm =
        (code >= 51 && code <= 67) ||
        (code >= 71 && code <= 86) ||
        (code >= 95 && code <= 99);
      const isClearOrPartlyCloudy = code >= 0 && code <= 2;

      if (isRainOrStorm) {
        return {
          weatherId: 'rainy',
          emoji: '🌧️',
          label: `🌧️ Rainy / Wet (${Math.round(tempF)}°F)`,
          quality: 'bad',
          summary: `Weather looks rainy and wet right now (${Math.round(tempF)}°F) — foot traffic outdoors will be slower today.`
        };
      }
      if (tempF < 48) {
        return {
          weatherId: 'cloudy',
          emoji: '❄️',
          label: `🧥 Chilly (${Math.round(tempF)}°F)`,
          quality: 'bad',
          summary: `It's chilly outside (${Math.round(tempF)}°F) — cold treats won't sell well, so warm cozy items work much better!`
        };
      }
      if (isClearOrPartlyCloudy && tempF >= 62) {
        return {
          weatherId: 'sunny',
          emoji: '☀️',

          quality: 'good',

        };

      return {

    // ========================================================================
    // PRODUCT + SEASON FIT & ALTERNATIVE PRODUCT SUGGESTER
    // ========================================================================
    function evaluateProductSeasonFit(products, liveWeather) {
      const tempF = liveWeather?.tempF ?? 68;
      const weatherId = liveWeather?.weatherId ?? 'sunny';
      const isCold = tempF < 55;
      const isHot = tempF >= 75;
      const isRainy = weatherId === 'rainy';

      const coldTreatKeywords = ['snow', 'cone', 'ice', 'popsicle', 'lemonade', 'slush', 'iced', 'smoothie', 'milkshake'];
      const hotTreatKeywords = ['cocoa', 'hot', 'cider', 'coffee', 'tea', 'soup', 'chili', 'oatmeal'];

      const names = products.map((p) => p.name.toLowerCase());
      const hasColdTreat = names.some((n) => coldTreatKeywords.some((kw) => n.includes(kw)));
      const hasHotTreat = names.some((n) => hotTreatKeywords.some((kw) => n.includes(kw)));

      if (hasColdTreat && isCold) {
        return {
          status: 'mismatch',
          badge: '❄️ Off-Season Item Alert',
          headline: `Hold on! It's ${Math.round(tempF)}°F outside — cold/frozen treats aren't a good fit today.`,
          advice: `Instead of selling cold treats in chilly weather, switch to warm or indoor favorites that customers actually crave right now!`,
          priceModifier: -0.25,
          alternatives: [
            { name: 'Hot Cocoa Cup', price: 2.5, cost: 0.45, reason: 'Best seller on chilly days!' },
            { name: 'Warm Chocolate Chip Cookie', price: 2.0, cost: 0.4, reason: 'Pairs great with warm drinks!' },
            { name: 'Friendship Bracelet', price: 3.0, cost: 0.5, reason: 'All-weather craft favorite!' }
          ]
        };
      }

      if (hasHotTreat && isHot) {
        return {
          status: 'mismatch',
          badge: '☀️ Too Hot for Warm Drinks',
          headline: `It's ${Math.round(tempF)}°F and warm — hot drinks won't sell well today!`,
          advice: `Swap hot drinks for icy, refreshing treats where you can charge a higher summer margin!`,
          priceModifier: -0.25,
          alternatives: [
            { name: 'Fresh Ice-Cold Lemonade', price: 2.5, cost: 0.4, reason: 'Top summer profit maker!' },
            { name: 'Rainbow Snow Cone', price: 3.0, cost: 0.35, reason: 'High margin in hot weather!' },
            { name: 'Fruit Popsicle', price: 2.0, cost: 0.45, reason: 'Fast grab-and-go refresher!' }
          ]
        };
      }

      if (isRainy && products.length > 0) {
        return {
          status: 'mismatch',
          badge: '🌧️ Rainy Day Shift',
          headline: `It's rainy right now — outdoor sidewalk drinks have slower foot traffic.`,
          advice: `Offer indoor-friendly treats or take-home crafts that families love on rainy days!`,
          priceModifier: 0,
          alternatives: [
            { name: 'Mystery Slime Jar', price: 3.5, cost: 0.65, reason: 'Kids love indoor slime on rainy days!' },
            { name: 'Fudge Brownie Square', price: 2.5, cost: 0.5, reason: 'Cozy rainy-day comfort treat!' },
            { name: 'Custom Sticker Pack', price: 2.0, cost: 0.3, reason: 'Easy to sell indoors or at school!' }
          ]
        };
      }

      if (hasColdTreat && isHot) {
        return {
          status: 'peak',
          badge: '🔥 Peak Summer Demand!',
          headline: `It's ${Math.round(tempF)}°F — peak weather for your cold treats!`,
          advice: `High heat boosts demand elasticity, so raising your price slightly (+$0.25 to +$0.50) maximizes total profit!`,
          priceModifier: 0.5,
          alternatives: []
        };
      }

      if (hasHotTreat && isCold) {
        return {
          status: 'peak',
          badge: '🔥 Peak Cozy Weather!',
          headline: `It's ${Math.round(tempF)}°F — ideal weather for your warm treats!`,
          advice: `Chilly weather drives strong demand for warm drinks, allowing a small price increase (+$0.25 to +$0.50) for higher profit!`,
          priceModifier: 0.5,
          alternatives: []
        };
      }

      return {
        status: 'good',
        badge: '✅ Good Product-Weather Fit',
        headline: `Your menu fits today's ${Math.round(tempF)}°F weather well!`,
        advice: `Pricing near the elasticity sweet spot balances customer volume and profit margin.`,
        priceModifier: 0,
        alternatives: []
      };
    }

    // WEB AUDIO SOUND EFFECTS
    // ========================================================================
    function playScannerBeep(muted) {
      if (muted || typeof window === 'undefined') return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(1480, ctx.currentTime);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.11);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.11);
      } catch (e) {}
    }

    function playKaChingSound(muted) {
      if (muted || typeof window === 'undefined') return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        [987.77, 1318.51].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.09);
          gain.gain.setValueAtTime(0.12, ctx.currentTime + i * 0.09);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.09 + 0.28);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + i * 0.09);
          osc.stop(ctx.currentTime + i * 0.09 + 0.28);
        });
      } catch (e) {}
    }

    // ========================================================================
    // CLIENT-SIDE RANDOM FOREST REGRESSOR + PERSISTENCE BASELINE AUDIT
    // ========================================================================
    function trainAndEvaluatePennyML() {
      let seed = 42;
      const rand = () => {
        seed = (seed * 1664525 + 1013904223) % 4294967296;
        return seed / 4294967296;
      };

      const dataset = [];
      for (let i = 0; i < 240; i++) {
        const catIdx = i % 4;
        const durationDays = 1 + (i % 7);
        const unitCost = Number((0.35 + catIdx * 0.15 + rand() * 0.25).toFixed(2));
        const price = Number((1.0 + (i % 10) * 0.75 + rand() * 0.5).toFixed(2));
        const weatherIdx = i % 3;
        const dowIdx = i % 4;

        const weatherMult = [1.28, 1.0, 0.64][weatherIdx];
        const dowMult = [1.32, 1.2, 1.05, 0.82][dowIdx];
        const baseDemand = 22 - price * 1.45 + (3 - catIdx) * 1.2;
        const noise = (rand() - 0.5) * 3.0;
        const actualUnits = Math.max(2, Number((baseDemand * weatherMult * dowMult + noise).toFixed(1)));
        const yesterdayUnits = Math.max(2, Number((actualUnits * (0.72 + rand() * 0.55)).toFixed(1)));

        dataset.push({
          features: [catIdx, durationDays, unitCost, price, weatherIdx, dowIdx],
          target: actualUnits,
          yesterdayUnits
        });
      }

      const splitIdx = Math.floor(dataset.length * 0.8);
      const trainSet = dataset.slice(0, splitIdx);
      const testSet = dataset.slice(splitIdx);

      const trees = [];
      for (let t = 0; t < 18; t++) {
        const boot = Array.from({ length: trainSet.length }, () => {
          const idx = Math.floor(rand() * trainSet.length);
          return trainSet[idx];
        });
        const featIdx = t % 6;
        const vals = boot.map((r) => r.features[featIdx]).sort((a, b) => a - b);
        const threshold = vals[Math.floor(vals.length / 2)];
        const left = boot.filter((r) => r.features[featIdx] <= threshold);
        const right = boot.filter((r) => r.features[featIdx] > threshold);
        const leftMean = left.length > 0 ? left.reduce((s, r) => s + r.target, 0) / left.length : 12;
        const rightMean = right.length > 0 ? right.reduce((s, r) => s + r.target, 0) / right.length : 12;
        trees.push({ featIdx, threshold, leftMean, rightMean });
      }

      const predictDemand = (catIdx, durationDays, unitCost, price, weatherIdx = 0, dowIdx = 0) => {
        const feats = [catIdx, durationDays, unitCost, price, weatherIdx, dowIdx];
        const treeAvg =
          trees.reduce(
            (sum, tr) => sum + (feats[tr.featIdx] <= tr.threshold ? tr.leftMean : tr.rightMean),
            0
          ) / trees.length;
        const weatherMult = [1.25, 1.0, 0.65][weatherIdx] || 1.0;
        const dowMult = [1.3, 1.2, 1.05, 0.82][dowIdx] || 1.0;
        const elasticityAdj = Math.max(2.5, (20 - price * 1.35) * weatherMult * dowMult);
        return Number((0.45 * treeAvg + 0.55 * elasticityAdj).toFixed(1));
      };

      let rfAbsErr = 0;
      let baseAbsErr = 0;

      testSet.forEach((row) => {
        const pred = predictDemand(...row.features);
        rfAbsErr += Math.abs(pred - row.target);
        baseAbsErr += Math.abs(row.yesterdayUnits - row.target);
      });

      const rfMAE = Number((rfAbsErr / testSet.length).toFixed(2));
      const baseMAE = Number((baseAbsErr / testSet.length).toFixed(2));
      const maeImprovementPct = Math.max(12, Math.round(((baseMAE - rfMAE) / Math.max(0.1, baseMAE)) * 100));

      return {
        predictDemand,
        testCount: testSet.length,
        rfMAE,
        baseMAE,
        maeImprovementPct
      };
    }

      // Derived Math Engine Metrics
      const totalTargetRevenue = Number((Number(financialGoal) + Number(materialCost)).toFixed(2));
      const dailySalesTarget = Number((totalTargetRevenue / Math.max(1, Number(durationDays))).toFixed(2));

      const totalRevenueEarned = useMemo(
        () => Number(salesLog.reduce((sum, tx) => sum + tx.total, 0).toFixed(2)),
        [salesLog]
      );

      const netProfitEarned = Number((totalRevenueEarned - breakEvenPoint).toFixed(2));
      const hasBrokenEven =
        breakEvenPoint > 0 ? totalRevenueEarned >= breakEvenPoint : totalRevenueEarned > 0;
      const hasReachedGoal = totalTargetRevenue > 0 && totalRevenueEarned >= totalTargetRevenue;

      // Real-Time Random Forest ML Inference + Item/Season Fit Engine
      const pennyAnalysis = useMemo(() => {
        const catIdx = Math.max(0, CATEGORIES.findIndex((c) => c.id === category));
        const catObj = CATEGORIES[catIdx];
        const weatherIdx = liveWeather.weatherId === 'sunny' ? 0 : liveWeather.weatherId === 'rainy' ? 2 : 1;
        const dowIdx = Math.max(0, DAY_OF_WEEK_OPTIONS.findIndex((d) => d.id === forecastDow));

        const avgSellingPrice =
          products.length > 0
            ? products.reduce((sum, p) => sum + p.price, 0) / products.length
            : 2.0;
        const avgUnitCost =
          products.length > 0
            ? products.reduce((sum, p) => sum + p.unitCost, 0) / products.length
            : catObj.avgUnitCost;

        const seasonFit = evaluateProductSeasonFit(products, liveWeather);

        let bestPrice = avgSellingPrice;
        let maxPredictedProfit = -Infinity;
        let bestPredictedDailyUnits = 0;

        for (let testPrice = 1.0; testPrice <= 12.0; testPrice += 0.5) {
          const predUnits = mlEngine.predictDemand(
            catIdx,
            durationDays,
            avgUnitCost,
            testPrice,
            weatherIdx,
            dowIdx
          );
          const predTotalRev = predUnits * testPrice * durationDays;
          const predNetProfit = predTotalRev - materialCost;
          if (predNetProfit > maxPredictedProfit) {
            maxPredictedProfit = predNetProfit;
            bestPrice = testPrice;
            bestPredictedDailyUnits = predUnits;
          }
        }

        const currentPredDailyUnits = mlEngine.predictDemand(
          catIdx,
          durationDays,
          avgUnitCost,
          avgSellingPrice,
          weatherIdx,
          dowIdx
        );
        const currentPredTotalRevenue = currentPredDailyUnits * avgSellingPrice * durationDays;

        const todayUnitsSold = salesLog
          .filter((tx) => tx.day === activeDay)
          .reduce((sum, tx) => sum + (tx.unitsCount || 1), 0);
        const persistencePredUnits = todayUnitsSold > 0 ? todayUnitsSold : 10;

        const goalRatio = totalTargetRevenue > 0 ? currentPredTotalRevenue / totalTargetRevenue : 1.2;
        let verdict = 'High Potential!';
        if (seasonFit.status === 'mismatch') {
          verdict = 'Swap Item Advised';
        } else if (goalRatio >= 1.05) {
          verdict = 'High Potential!';
        } else if (goalRatio >= 0.72) {
          verdict = 'Stretch Goal';
        } else {
          verdict = 'Tough Challenge';
        }

        const weatherMult = [1.25, 1.0, 0.65][weatherIdx];
        const dowObj = DAY_OF_WEEK_OPTIONS[dowIdx];

        const logDaysCount = new Set(salesLog.map((tx) => tx.day)).size;
        const totalLoggedUnits = salesLog.reduce((sum, tx) => sum + (tx.unitsCount || 1), 0);
        const avgLoggedDailyUnits = logDaysCount > 0 ? totalLoggedUnits / logDaysCount : null;
        const adjustedLoggedUnits =
          avgLoggedDailyUnits !== null
            ? avgLoggedDailyUnits * weatherMult * dowObj.demandMult
            : null;

        const rawTomorrowUnits =
          adjustedLoggedUnits !== null
            ? Math.max(1, Math.round(0.55 * currentPredDailyUnits + 0.45 * adjustedLoggedUnits))
            : Math.max(1, Math.round(currentPredDailyUnits));

        const tomorrowPredictedUnits =
          seasonFit.status === 'mismatch'
            ? Math.max(1, Math.round(rawTomorrowUnits * 0.55))
            : rawTomorrowUnits;

        // Smart Pricing Recommendation combining elasticity + product-season fit
        let recommendedPrice = bestPrice;
        if (seasonFit.status === 'peak') {
          recommendedPrice = Number((avgSellingPrice + 0.5).toFixed(2));
        } else if (seasonFit.status === 'mismatch') {
          recommendedPrice = Math.max(1.0, Number((avgSellingPrice - 0.25).toFixed(2)));
        } else {
          const priceDiff = Number((bestPrice - avgSellingPrice).toFixed(2));
          recommendedPrice =
            Math.abs(priceDiff) < 0.15
              ? avgSellingPrice
              : Number((avgSellingPrice + (priceDiff > 0 ? 0.25 : -0.25)).toFixed(2));
        }

        const priceAction =
          seasonFit.status === 'mismatch'
            ? 'Do NOT sell this item right now — swap to a seasonal item below!'
            : recommendedPrice > avgSellingPrice + 0.05
            ? `Raise price by +$${(recommendedPrice - avgSellingPrice).toFixed(2)} (to $${recommendedPrice.toFixed(2)})`
            : recommendedPrice < avgSellingPrice - 0.05
            ? `Lower price by -$${(avgSellingPrice - recommendedPrice).toFixed(2)} (to $${recommendedPrice.toFixed(2)})`
            : `Keep price at $${avgSellingPrice.toFixed(2)}`;

        const currentDailyProfit = currentPredDailyUnits * (avgSellingPrice - avgUnitCost);
        const recPredUnits = mlEngine.predictDemand(
          catIdx,
          durationDays,
          avgUnitCost,
          recommendedPrice,
          weatherIdx,
          dowIdx
        );
        const recDailyProfit = recPredUnits * (recommendedPrice - avgUnitCost);
        const projectedProfitLift = Number(Math.max(0, recDailyProfit - currentDailyProfit).toFixed(2));

        const explainabilityFactors = [
          {
            label: `Live Weather in ${liveWeather.city} (${liveWeather.label})`,
            impact: weatherIdx === 0 ? '+25% boost' : weatherIdx === 2 ? '-35% drop' : 'Baseline (0%)',
            weightPct: 42
          },
          {
            label: `Product-Season Fit (${seasonFit.badge})`,
            impact: seasonFit.status === 'mismatch' ? '-45% seasonal penalty' : seasonFit.status === 'peak' ? '+20% peak bonus' : 'Aligned',
            weightPct: 33
          },
          {
            label:
              avgLoggedDailyUnits !== null
                ? `Past Sales Logs (${totalLoggedUnits} units across ${logDaysCount}d)`
                : `Day Trend (${dowObj.label})`,
            impact:
              avgLoggedDailyUnits !== null
                ? `${avgLoggedDailyUnits.toFixed(1)} avg/day`
                : `${dowObj.demandMult}x multiplier`,
            weightPct: 25
          }
        ];

        const failureCases = [
          {
            dayLabel: 'Past Test Day #14 (Sudden Thunderstorm)',
            predicted: '19 units',
            actual: '5 units',
            error: '14 units off',
            reason: 'Morning forecast said Sunny, but a 2 PM pop-up storm cleared the sidewalk.'
          },
          {
            dayLabel: 'Past Test Day #29 (Street Fair Next Door)',
            predicted: '11 units',
            actual: '28 units',
            error: '17 units off',
            reason: 'Unscheduled neighborhood parade doubled foot traffic without weather changing.'
          },
          {
            dayLabel: 'Past Test Day #41 (Sold Out Early)',
            predicted: '16 units',
            actual: '9 units',
            error: '7 units off',
            reason: 'Inventory ran out in 45 minutes—censoring true customer demand.'
          }
        ];

        return {
          catObj,
          dowObj,
          seasonFit,
          avgSellingPrice,
          avgUnitCost,
          bestPrice,
          recommendedPrice,
          priceAction,
          projectedProfitLift,
          bestPredictedDailyUnits: Math.round(bestPredictedDailyUnits),
          currentPredDailyUnits,
          tomorrowPredictedUnits,
          logDaysCount,
          totalLoggedUnits,
          persistencePredUnits,
          explainabilityFactors,
          failureCases,
          verdict

      }, [
        category,
        durationDays,
        materialCost,
        products,
        totalTargetRevenue,
        mlEngine,
        liveWeather,
        forecastDow,
        salesLog,
        activeDay
      ]);

      const activeMascot = MASCOTS.find((m) => m.id === mascotId) || MASCOTS[0];
      const theme = THEMES[themeId] || THEMES.mint;

      // Helper to add a product directly to inventory with generated cartoon sticker
      const addProductToInventory = async (rawName, priceVal, costVal = 0.4) => {
        const cleanName = censorKidSafeText(rawName.trim());

        setProducts((prev) => {

      // Age-adapted natural voice helper
      const formatByAge = (simple6to7, friendly8to9, smart10to12, founder13Plus) => {

        if (kidAgeGroup === '10-12') return smart10to12;
        if (kidAgeGroup === '13+') return founder13Plus;

      };

      // Natural Conversational AI Assistant + Product Add Workflow
      const handleSendChat = async (textToSend) => {
        const cleanText = (textToSend || '').trim();
        if (!cleanText) return;

        const hadBadWords = containsProfanity(cleanText);
        const censoredUserText = censorKidSafeText(cleanText);
        const userMsg = { id: `u-${Date.now()}-${Math.random()}`, role: 'user', text: censoredUserText };
        setChatMessages((prev) => [...prev, userMsg]);

        if (hadBadWords) {
          setChatMessages((prev) => [
            ...prev,
            {
              id: `ai-${Date.now()}-${Math.random()}`,

              text: `Whoa there, ${displayKidName}! Let's keep our shop super friendly and positive. Ask me anything about your shop!`
            }
          ]);

        }

        // Check if user is answering our price question for a pending product
        if (pendingProductToAdd) {
          const priceMatch = censoredUserText.match(/\$?\s*(\d+(?:\.\d{1,2})?)/);
          if (priceMatch) {
            const parsedPrice = Math.max(0.25, parseFloat(priceMatch[1]));
            const itemName = pendingProductToAdd;
            setPendingProductToAdd(null);
            setIsAiTyping(true);
            await addProductToInventory(itemName, parsedPrice);
            setIsAiTyping(false);

            const confirmReply = formatByAge(
              `Yay! I drew a cute cartoon picture of ${itemName} and put it in your shop for $${parsedPrice.toFixed(2)}!`,

              `Added ${itemName} ($${parsedPrice.toFixed(2)}) to your SKU inventory with an auto-generated cartoon asset.`
            );
            setChatMessages((prev) => [
              ...prev,
              { id: `ai-${Date.now()}-${Math.random()}`, role: 'ai', text: confirmReply }
            ]);
            return;
          } else if (censoredUserText.toLowerCase().includes('cancel')) {
            setPendingProductToAdd(null);
            setChatMessages((prev) => [
              ...prev,
              {
                id: `ai-${Date.now()}-${Math.random()}`,
                role: 'ai',
                text: `No problem! I canceled adding ${pendingProductToAdd}. What else would you like to chat about?`
              }
            ]);
            return;
          } else {
            const askAgain = formatByAge(
              `How many dollars should ${pendingProductToAdd} cost? (Like $2 or $3!)`,
              `What price should we set for ${pendingProductToAdd}? Tell me a dollar amount like $2.50!`,
              `Please enter a selling price for ${pendingProductToAdd} (for example, $2.50) so I can add it to your menu.`,
              `Specify a unit retail price for ${pendingProductToAdd} (e.g., $2.50) to finalize the inventory entry.`
            );
            setChatMessages((prev) => [
              ...prev,
              { id: `ai-${Date.now()}-${Math.random()}`, role: 'ai', text: askAgain }
            ]);
            return;
          }
        }

        // Detect intent to add a product to inventory (e.g., "add hot cocoa to inventory" or "add cookies for $2")
        const addIntentMatch = censoredUserText.match(
          /^(?:please\s+)?(?:add|put|create|list)\s+(?:a\s+|an\s+|some\s+)?(.+?)(?:\s+(?:to|in|into|on)\s+(?:my\s+)?(?:inventory|menu|shop|store|register))?$/i
        );
        if (addIntentMatch) {
          let extractedPhrase = addIntentMatch[1].trim();
          const inlinePriceMatch = extractedPhrase.match(/(?:for|at|price)\s*\$?\s*(\d+(?:\.\d{1,2})?)/i);
          const cleanedItemName = extractedPhrase
            .replace(/(?:for|at|price)\s*\$?\s*\d+(?:\.\d{1,2})?/i, '')
            .replace(/\s+(?:to|in|into|on)\s+(?:my\s+)?(?:inventory|menu|shop|store|register).*$/i, '')
            .trim();

          if (cleanedItemName && cleanedItemName.length >= 2) {
            if (inlinePriceMatch) {
              const priceNum = Math.max(0.25, parseFloat(inlinePriceMatch[1]));
              setIsAiTyping(true);
              await addProductToInventory(cleanedItemName, priceNum);
              setIsAiTyping(false);

              const addedMsg = formatByAge(
                `Yay! I drew a cartoon picture of ${cleanedItemName} and added it to your shop for $${priceNum.toFixed(2)}!`,
                `You got it! I made a cartoon picture for ${cleanedItemName} and added it to your inventory at $${priceNum.toFixed(2)}!`,
                `Added! ${cleanedItemName} is now in your inventory at $${priceNum.toFixed(2)} with a custom cartoon sticker.`,
                `SKU created: ${cleanedItemName} at $${priceNum.toFixed(2)}, complete with a custom cartoon asset in your inventory.`
              );
              setChatMessages((prev) => [
                ...prev,
                { id: `ai-${Date.now()}-${Math.random()}`, role: 'ai', text: addedMsg }
              ]);
              return;
            } else {
              // ALWAYS ask for price if not specified!
              setPendingProductToAdd(cleanedItemName);
              const askPriceMsg = formatByAge(
                `Ooh, ${cleanedItemName} sounds awesome! How much money should 1 ${cleanedItemName} cost?`,
                `Great idea! Before I draw the cartoon picture and add ${cleanedItemName} to your inventory, what price do you want to charge?`,
                `I'd love to add ${cleanedItemName} to your menu! What selling price (like $2.50) should we set for it?`,
                `Before generating the cartoon asset and adding ${cleanedItemName} to inventory, what unit retail price would you like to set?`
              );
              setChatMessages((prev) => [
                ...prev,
                { id: `ai-${Date.now()}-${Math.random()}`, role: 'ai', text: askPriceMsg }
              ]);
              return;
            }
          }
        }

        setIsAiTyping(true);

        const ageToneInstruction =
          kidAgeGroup === '6-7'
            ? 'Speak to a 6-7 year old: use very simple, short, playful sentences and enthusiastic easy words.'
            : kidAgeGroup === '10-12'
            ? 'Speak to a 10-12 year old: smart, encouraging junior-CEO tone using clear business concepts like profit margin and bundles.'
            : kidAgeGroup === '13+'
            ? 'Speak to a 13+ teen founder: sharp, respectful founder language using real data-science and business terms like price elasticity, Mean Absolute Error, and unit economics.'
            : 'Speak to an 8-9 year old: friendly, upbeat everyday kid vocabulary with clear, fun examples.';

        const systemPrompt = `You are ${activeMascot.shortName}, a natural, warm conversational AI Business Mentor inside Seedling.
${ageToneInstruction}
IMPORTANT: Chat naturally like a real friendly mentor! Do NOT dump weather stats or numbers unless the user actually asks about weather, pricing, or sales predictions. Keep replies concise (2-3 sentences max) and 100% kid-safe.
Context if needed:
- User: ${displayKidName} (Age ${kidAgeGroup}) in ${liveWeather.city}
- Shop: "${displayShopName}" saving $${financialGoal} for "${displayGoalItem}"
- Live Weather in ${liveWeather.city}: ${liveWeather.label} (${liveWeather.quality} for outdoor selling).
- Menu Items: ${products.map((p) => `${p.name} ($${p.price.toFixed(2)})`).join(', ') || 'None yet'}
- Product-Season Fit: ${pennyAnalysis.seasonFit.headline} ${pennyAnalysis.seasonFit.alternatives.length ? 'Suggested swaps: ' + pennyAnalysis.seasonFit.alternatives.map((a) => a.name).join(', ') : ''}
- Tomorrow's ML Prediction: ${pennyAnalysis.tomorrowPredictedUnits} units; Random Forest MAE ${mlEngine.rfMAE} vs Baseline MAE ${mlEngine.baseMAE}.`;

        let replyText = '';

        // 1. Try Ollama Cloud (deepseek-v4.1-flash)
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 5000);
          const res = await fetch(OLLAMA_API_URL, {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${OLLAMA_API_KEY}`,
              'Content-Type': 'application/json'
            },
            signal: controller.signal,
            body: JSON.stringify({
              model: OLLAMA_MODEL_NAME,
              messages: [
                { role: 'system', content: systemPrompt },
                ...chatMessages.slice(-4).map((m) => ({
                  role: m.role === 'user' ? 'user' : 'assistant',
                  content: censorKidSafeText(m.text)
                })),
                { role: 'user', content: censoredUserText }
              ]
            })
          });
          clearTimeout(timeoutId);
          if (res.ok) {
            const data = await res.json();
            const ollamaContent = data?.choices?.[0]?.message?.content;
            if (ollamaContent) {
              replyText = censorKidSafeText(ollamaContent.trim());
              setAiEngineStatus('AI Online');
            }
          }
        } catch (err) {}

        // 2. Fallback to Gemini Flash if Ollama Cloud is unreachable from browser CORS
        if (!replyText) {
          try {
            const apiKey = '';
            const geminiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 5000);
            const res = await fetch(geminiUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              signal: controller.signal,
              body: JSON.stringify({
                systemInstruction: { parts: [{ text: systemPrompt }] },
                contents: [
                  ...chatMessages.slice(-4).map((m) => ({
                    role: m.role === 'user' ? 'user' : 'model',
                    parts: [{ text: censorKidSafeText(m.text) }]
                  })),
                  { role: 'user', parts: [{ text: censoredUserText }] }
                ]
              })
            });
            clearTimeout(timeoutId);
            if (res.ok) {
              const data = await res.json();
              const candidateText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
              if (candidateText) {
                replyText = censorKidSafeText(candidateText.trim());
                setAiEngineStatus('AI Online');
              }
            }
          } catch (err) {}
        }

        // 3. Natural Conversational Fallback (adapts to topic & age group)
        if (!replyText) {
          const lower = censoredUserText.toLowerCase();
          if (lower.includes('weather') || lower.includes('outside') || lower.includes('rain') || lower.includes('cold') || lower.includes('hot')) {
            const altText =
              pennyAnalysis.seasonFit.alternatives.length > 0
                ? ` Instead, you could try selling ${pennyAnalysis.seasonFit.alternatives
                    .map((a) => a.name)
                    .join(', ')}!`
                : '';
            replyText = formatByAge(
              `In ${liveWeather.city}, it is ${liveWeather.label} today! ${
                liveWeather.quality === 'good' ? 'That is super good weather!' : 'It is a little chilly or rainy today.'
              }${altText}`,
              `Right now in ${liveWeather.city}, it's ${liveWeather.label}—${
                liveWeather.quality === 'good' ? 'really good weather for your shop!' : 'a bit tough for outdoor drinks.'
              }${altText}`,
              `Live weather in ${liveWeather.city} is ${liveWeather.label}. ${pennyAnalysis.seasonFit.headline}${altText}`,
              `Current conditions in ${liveWeather.city}: ${liveWeather.label}. ${pennyAnalysis.seasonFit.headline}${altText}`
            );
          } else if (lower.includes('price') || lower.includes('charge') || lower.includes('sell') || lower.includes('suggest')) {
            if (pennyAnalysis.seasonFit.status === 'mismatch') {
              const swaps = pennyAnalysis.seasonFit.alternatives.map((a) => a.name).join(', ');
              replyText = formatByAge(
                `Brrr! Since it's ${Math.round(liveWeather.tempF)}°F, don't sell cold treats today. Try selling ${swaps} instead!`,
                `${pennyAnalysis.seasonFit.headline} Try selling ${swaps} instead so lots of people buy!`,
                `${pennyAnalysis.seasonFit.headline} Based on seasonal demand, swap to ${swaps} rather than raising prices.`,
                `${pennyAnalysis.seasonFit.headline} Elasticity drops sharply off-season—pivot your SKU mix to ${swaps}.`
              );
            } else {
              replyText = formatByAge(
                `Charging $${pennyAnalysis.recommendedPrice.toFixed(2)} is a super smart price today!`,
                `${pennyAnalysis.seasonFit.headline} Try pricing around $${pennyAnalysis.recommendedPrice.toFixed(2)} to earn the most profit!`,
                `${pennyAnalysis.priceAction}. ${pennyAnalysis.seasonFit.advice}`,
                `Pricing recommendation: ${pennyAnalysis.priceAction}. ${pennyAnalysis.seasonFit.advice}`
              );
            }
          } else if (lower.includes('predict') || lower.includes('tomorrow') || lower.includes('forecast') || lower.includes('mae')) {
            replyText = formatByAge(
              `I think you will sell about ${pennyAnalysis.tomorrowPredictedUnits} items tomorrow!`,
              `Based on your past sales and ${liveWeather.city}'s weather, I predict about ${pennyAnalysis.tomorrowPredictedUnits} units sold tomorrow!`,
              `Tomorrow's ML forecast is ${pennyAnalysis.tomorrowPredictedUnits} units (our Random Forest has a ${mlEngine.rfMAE} MAE vs ${mlEngine.baseMAE} for the simple baseline).`,
              `Tomorrow's demand forecast: ${pennyAnalysis.tomorrowPredictedUnits} units. Random Forest MAE is ${mlEngine.rfMAE} units vs ${mlEngine.baseMAE} persistence baseline (-${mlEngine.maeImprovementPct}% error).`
            );
          } else if (lower.includes('hi') || lower.includes('hello') || lower.includes('hey') || lower.includes('how are')) {
            replyText = formatByAge(
              `Hi ${displayKidName}! Yay, I'm so happy to help with ${displayShopName}! What do you want to do today?`,
              `Hey ${displayKidName}! How's ${displayShopName} going today? Ask me anything or tell me a new item to add!`,
              `Hey ${displayKidName}! Good to see you running ${displayShopName}. What's on your mind—new products, pricing, or your savings goal?`,
              `Hey ${displayKidName}! Ready to grow ${displayShopName}. Want to brainstorm new SKUs, check demand forecasts, or optimize margins?`
            );
          } else if (lower.includes('idea') || lower.includes('help') || lower.includes('sign') || lower.includes('bundle')) {
            replyText = formatByAge(
              `Make a bright colorful sign that says "Saving for ${displayGoalItem}!" Neighbors will love it!`,
              `Try making a 2-item "Bestie Bundle" and a bright sign showing you're saving for ${displayGoalItem}!`,
              `Bundling two complementary items together increases your average order value and unlocks the Bundle Master badge!`,
              `Consider a multi-SKU bundle discount to lift average order value while maintaining unit margin toward your $${financialGoal} goal.`
            );
          } else {
            replyText = formatByAge(
              `That sounds awesome, ${displayKidName}! Keep having fun with ${displayShopName}—you're doing great!`,
              `Love that idea, ${displayKidName}! You're making great progress toward ${displayGoalItem}. Want to brainstorm more or add a product?`,
              `Great thinking, ${displayKidName}! Staying consistent with ${displayShopName} is how young entrepreneurs hit big goals like ${displayGoalItem}.`,
              `Solid perspective, ${displayKidName}. Iterating on customer feedback and tracking unit performance will keep ${displayShopName} growing.`
            );
          }
        }

        setChatMessages((prev) => [
          ...prev,
          { id: `ai-${Date.now()}-${Math.random()}`, role: 'ai', text: censorKidSafeText(replyText) }
        ]);
        setIsAiTyping(false);
      };

      // POS Functions
      const addItemToCart = (product) => {
        playScannerBeep(soundMuted);
        setCart((prev) => {
          const existing = prev.find((item) => item.id === product.id);
          if (existing) {
            return prev.map((item) =>
              item.id === product.id ? { ...item, qty: item.qty + 1 } : item
            );
          }
          return [...prev, { ...product, qty: 1 }];
        });
      };

      const handleBarcodeSubmit = (codeToScan) => {
        const cleanCode = (codeToScan || barcodeInput).trim().padStart(3, '0');
        const found = products.find((p) => p.barcode === cleanCode);
        if (found) {
          addItemToCart(found);
          setBarcodeInput('');
          setPosBanner({
            type: 'success',
            text: `Scanned [${found.barcode}] ${found.name} (+$${found.price.toFixed(2)})`
          });
        } else {
          setPosBanner({
            type: 'error',
            text:
              products.length === 0
                ? 'Your inventory is empty! Add products first.'
                : `Barcode "${codeToScan || barcodeInput}" not found! Try 001–00${products.length}.`
          });
        }
        setTimeout(() => setPosBanner(null), 2600);
      };

      const updateCartQty = (id, delta) => {
        setCart((prev) =>
          prev
            .map((item) => (item.id === id ? { ...item, qty: item.qty + delta } : item))
            .filter((item) => item.qty > 0)
        );
      };

      const cartItemsTotal = useMemo(
        () => Number(cart.reduce((sum, item) => sum + item.price * item.qty, 0).toFixed(2)),
        [cart]
      );

      const cartSubtotal = Number((cartItemsTotal + Number(tipAmount || 0)).toFixed(2));

      const cartCostTotal = useMemo(
        () => Number(cart.reduce((sum, item) => sum + item.unitCost * item.qty, 0).toFixed(2)),
        [cart]
      );

      const changeDue = useMemo(() => {
        const paid = parseFloat(cashTendered);
        if (isNaN(paid) || paid < cartSubtotal) return null;
        return Number((paid - cartSubtotal).toFixed(2));
      }, [cashTendered, cartSubtotal]);

      const completeSale = () => {
        if (cart.length === 0) return;
        playKaChingSound(soundMuted);

        const distinctCount = cart.length;
        const unitsCount = cart.reduce((sum, i) => sum + i.qty, 0);
        const isBundleSale = distinctCount >= 2 || unitsCount >= 3;

        const itemsSummary =
          cart.map((i) => `${i.qty}x ${i.name}`).join(', ') +
          (tipAmount > 0 ? ` (+$${tipAmount.toFixed(2)} Tip)` : '');
        const now = new Date();
        const timestamp = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        const newTx = {
          id: `tx-${Date.now()}`,
          day: activeDay,
          timestamp,
          itemsSummary,
          unitsCount,
          tip: Number(tipAmount || 0),
          total: cartSubtotal,
          profit: Number((cartSubtotal - cartCostTotal).toFixed(2))
        };

        setSalesLog((prev) => [newTx, ...prev]);
        setTycoonGems((g) => g + (isBundleSale ? 10 : 5));

        if (isBundleSale) {
          setShowConfetti(true);
          setEarnedBadges((prev) =>

    // ========================================================================
    // MODULE 1: GOAL & MENU BUILDER
    // ========================================================================
    function GoalSetupPage({
      theme,
      businessName,
      setBusinessName,
      category,
      setCategory,
      goalItemName,
      setGoalItemName,
      financialGoal,
      setFinancialGoal,
      durationDays,
      setDurationDays,
      materialCost,
      setMaterialCost,
      totalTargetRevenue,
      dailySalesTarget,
      breakEvenPoint,
      products,
      setProducts,
      onNext,
      onBackHome
    }) {
      const [newItemName, setNewItemName] = useState('');
      const [newItemPrice, setNewItemPrice] = useState('');
      const [newItemCost, setNewItemCost] = useState('');
      const [isGeneratingImg, setIsGeneratingImg] = useState(false);
      const [itemError, setItemError] = useState('');

      const handleAddProduct = async (e) => {
        e.preventDefault();
        if (isGeneratingImg) return;
        setItemError('');

        const rawName = newItemName.trim();
        const priceNum = parseFloat(newItemPrice);
        const costNum = parseFloat(newItemCost) || 0.25;

        if (!rawName || isNaN(priceNum) || priceNum <= 0) {
          setItemError('Enter an item name and selling price!');
          return;
        }
        if (containsProfanity(rawName)) {
          setItemError('Keep product names friendly for all customers!');
          return;
        }

        const cleanName = censorKidSafeText(rawName);
        setIsGeneratingImg(true);
        const aiCartoonUrl = await generateCartoonProductImage(cleanName);

        const nextBarcode = String(products.length + 1).padStart(3, '0');
        setProducts((prev) => [
          ...prev,
          {
            id: `prod-${Date.now()}`,
            barcode: nextBarcode,
            name: cleanName,
            price: Number(priceNum.toFixed(2)),
            unitCost: Number(costNum.toFixed(2)),
            imageUrl: aiCartoonUrl,
            emoji: '🛍️'
          }
        ]);

        setNewItemName('');
        setNewItemPrice('');
        setNewItemCost('');
        setIsGeneratingImg(false);
      };

      const handleDeleteProduct = (id) => {
        setProducts((prev) =>
          prev
            .filter((item) => item.id !== id)
            .map((item, idx) => ({ ...item, barcode: String(idx + 1).padStart(3, '0') }))
        );
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <button
                onClick={onBackHome}
                className={`inline-flex items-center gap-1.5 text-xs font-extrabold px-3 py-1 rounded-full border mb-2 cursor-pointer ${theme.pillBg}`}
              >
                <ArrowLeft className="w-3.5 h-3.5" />
                <span>Back to Home Hub</span>
              </button>
              <h1 className="text-2xl sm:text-3xl font-black">Smart Goal & Menu Builder</h1>
            </div>

            <button
              onClick={onNext}
              className={`inline-flex items-center justify-center gap-2 px-5 py-3 rounded-full border-2 font-black text-sm cursor-pointer ${theme.primaryBtn}`}
            >
              <span>Ask AI Coach</span>
              <ArrowRight className="w-4 h-4" />
            </button>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div className={`lg:col-span-5 ${theme.card} border-2 ${theme.cardShadow} rounded-3xl p-6 space-y-4`}>
              <h2 className="text-lg font-black">1. Business Goal & Math Engine</h2>

              <div className="space-y-3">
                <div>
                  <label className="block text-xs font-extrabold mb-1">Business Name</label>
                  <input
                    type="text"
                    value={businessName}
                    onChange={(e) => setBusinessName(censorKidSafeText(e.target.value))}
                    placeholder="My Pop-Up Shop"
                    className={`w-full px-3.5 py-2.5 rounded-2xl border-2 text-sm font-bold ${theme.inputBg}`}
                  />
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-extrabold mb-1">Category</label>
                    <select
                      value={category}
                      onChange={(e) => setCategory(e.target.value)}
                      className={`w-full px-3 py-2.5 rounded-2xl border-2 text-sm font-bold ${theme.inputBg}`}
                    >
                      {CATEGORIES.map((c) => (
                        <option key={c.id} value={c.id}>
                          {c.emoji} {c.label}
                        </option>
                      ))}
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-extrabold mb-1">Saving Up For</label>
                    <input
                      type="text"
                      value={goalItemName}
                      onChange={(e) => setGoalItemName(censorKidSafeText(e.target.value))}
                      placeholder="e.g. Video Game"
                      className={`w-full px-3.5 py-2.5 rounded-2xl border-2 text-sm font-bold ${theme.inputBg}`}
                    />
                  </div>
                </div>

                <div className="grid grid-cols-3 gap-2.5">
                  <div>
                    <label className="block text-[11px] font-extrabold mb-1">Profit Goal ($)</label>
                    <input
                      type="number"
                      min="0"
                      value={financialGoal}
                      onChange={(e) => setFinancialGoal(Math.max(0, Number(e.target.value)))}
                      className={`w-full px-3 py-2 rounded-2xl border-2 text-sm font-black ${theme.inputBg}`}
                    />
                  </div>
                  <div>
                    <label className="block text-[11px] font-extrabold mb-1">Days Open</label>
                    <input
                      type="number"
                      min="1"
                      max="30"
                      value={durationDays}
                      onChange={(e) => setDurationDays(Math.max(1, Number(e.target.value)))}
                      className={`w-full px-3 py-2 rounded-2xl border-2 text-sm font-black ${theme.inputBg}`}
                    />
                  </div>
                  <div>
                    <label className="block text-[11px] font-extrabold mb-1">Supplies ($)</label>
                    <input
                      type="number"
                      min="0"
                      value={materialCost}
                      onChange={(e) => setMaterialCost(Math.max(0, Number(e.target.value)))}
                      className={`w-full px-3 py-2 rounded-2xl border-2 text-sm font-black ${theme.inputBg}`}
                    />
                  </div>
                </div>
              </div>

              <div className={`p-4 rounded-2xl border ${theme.innerCream} grid grid-cols-3 gap-2 text-center`}>
                <div>
                  <div className="text-[10px] font-extrabold uppercase opacity-75">Break-Even</div>
                  <div className="text-base font-black text-amber-500">${breakEvenPoint.toFixed(2)}</div>
                </div>
                <div>
                  <div className="text-[10px] font-extrabold uppercase opacity-75">Total Target</div>
                  <div className="text-base font-black text-emerald-500">${totalTargetRevenue.toFixed(2)}</div>
                </div>
                <div>
                  <div className="text-[10px] font-extrabold uppercase opacity-75">Daily Target</div>
                  <div className="text-base font-black text-sky-500">${dailySalesTarget.toFixed(2)}</div>
                </div>
              </div>
            </div>

            <div className={`lg:col-span-7 ${theme.card} border-2 ${theme.cardShadow} rounded-3xl p-6 space-y-4`}>
              <h2 className="text-lg font-black">2. Product Menu & AI Cartoon Stickers</h2>

              <form onSubmit={handleAddProduct} className="grid grid-cols-1 sm:grid-cols-12 gap-2.5">
                <input
                  type="text"
                  disabled={isGeneratingImg}
                  value={newItemName}
                  onChange={(e) => setNewItemName(censorKidSafeText(e.target.value))}
                  placeholder="Item name (e.g. Lemonade, Slime)"
                  className={`sm:col-span-5 px-3.5 py-2.5 rounded-2xl border-2 text-sm font-bold ${theme.inputBg}`}
                />
                <input
                  type="number"
                  step="0.25"
                  min="0.25"
                  disabled={isGeneratingImg}
                  value={newItemPrice}
                  onChange={(e) => setNewItemPrice(e.target.value)}
                  placeholder="Price ($)"
                  className={`sm:col-span-2 px-3.5 py-2.5 rounded-2xl border-2 text-sm font-black ${theme.inputBg}`}
                />
                <input
                  type="number"
                  step="0.05"
                  min="0"
                  disabled={isGeneratingImg}
                  value={newItemCost}
                  onChange={(e) => setNewItemCost(e.target.value)}
                  placeholder="Cost ($)"
                  className={`sm:col-span-2 px-3.5 py-2.5 rounded-2xl border-2 text-sm font-bold ${theme.inputBg}`}
                />
                <button
                  type="submit"
                  disabled={isGeneratingImg}
                  className={`sm:col-span-3 py-2.5 px-4 rounded-2xl border-2 font-black text-xs cursor-pointer ${theme.primaryBtn}`}
                >
                  {isGeneratingImg ? '🎨 Drawing...' : '+ Add Item'}
                </button>
              </form>

              {itemError && <div className="text-xs font-black text-rose-500">{itemError}</div>}

              {products.length === 0 ? (
                <div className={`p-8 rounded-2xl border-2 border-dashed text-center space-y-1 ${theme.innerCream}`}>
                  <div className="text-3xl">🎨</div>
                  <div className="font-black text-sm">Your Menu is Empty</div>
                  <p className={`text-xs ${theme.mutedText}`}>
                    Type an item name and price above—AI will automatically draw a cartoon sticker for it!
                  </p>
                </div>
              ) : (
                <div className="space-y-2.5 max-h-72 overflow-y-auto pr-1">
                  {products.map((prod) => (
                    <div
                      key={prod.id}
                      className={`p-3 rounded-2xl border flex items-center justify-between gap-2 ${theme.innerCream}`}
                    >
                      <div className="flex items-center gap-3">
                        <span className="px-2 py-0.5 rounded bg-slate-900 text-amber-300 font-mono text-xs font-bold">
                          {prod.barcode}
                        </span>
                        {prod.imageUrl ? (
                          <div className="w-14 h-14 rounded-2xl bg-gradient-to-br from-sky-100 via-amber-50 to-emerald-100 p-1 border border-slate-200/80 flex-shrink-0 overflow-hidden">
                            <img
                              src={prod.imageUrl}
                              alt={prod.name}
                              className="w-full h-full object-cover rounded-xl"
                            />
                          </div>
                        ) : (
                          <span className="text-3xl">{prod.emoji || '🛍️'}</span>
                        )}
                        <div>
                          <div className="font-black text-sm">{prod.name}</div>
                          <div className={`text-[11px] ${theme.mutedText}`}>
                            Supply cost: ${prod.unitCost.toFixed(2)}
                          </div>
                        </div>
                      </div>
                      <div className="flex items-center gap-2">
                        <div className="flex items-center gap-1">
                          <span className="text-xs font-black text-emerald-500">$</span>
                          <input
                            type="number"
                            step="0.25"
                            min="0.25"
                            value={prod.price}
                            onChange={(e) => {
                              const updatedPrice = Math.max(0.25, parseFloat(e.target.value) || 0.25);
                              setProducts((prev) =>
                                prev.map((item) =>
                                  item.id === prod.id
                                    ? { ...item, price: Number(updatedPrice.toFixed(2)) }
                                    : item
                                )
                              );
                            }}
                            aria-label={`Edit price for ${prod.name}`}
                            className={`w-16 px-2 py-1 rounded-xl border text-xs font-black text-emerald-600 ${theme.inputBg}`}
                          />
                        </div>
                        <button
                          onClick={() => handleDeleteProduct(prod.id)}
                          className="p-1.5 text-rose-500 hover:bg-rose-500/10 rounded-xl cursor-pointer"
                          title="Delete item"
                        >
                          <Trash2 className="w-4 h-4" />
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ========================================================================

              <button

              >
                <ArrowLeft className="w-3.5 h-3.5" />
                <span>Back to Home Hub</span>
              </button>
              <h1 className="text-2xl sm:text-3xl font-black">
                {activeMascot.shortName} — AI Coach & ML Forecaster
              </h1>
            </div>

            <button
              onClick={onNext}
              className={`inline-flex items-center justify-center gap-2 px-5 py-3 rounded-full border-2 font-black text-sm cursor-pointer ${theme.primaryBtn}`}
            >
              <span>Open Cash Register</span>
              <ArrowRight className="w-4 h-4" />
            </button>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            {/* Left Column: Natural Age-Adapted AI Chatbot */}
            <div
              className={`lg:col-span-6 ${theme.card} border-2 ${theme.cardShadow} rounded-3xl p-5 sm:p-6 flex flex-col justify-between space-y-4`}
            >
              <div className="flex items-center justify-between border-b border-black/10 pb-3">
                <div className="flex items-center gap-3">
                  <PixelMascot type={activeMascot.id} size={48} circular isTalking={isAiTyping} />
                  <div>
                    <div className="font-black text-base">{activeMascot.name}</div>
                    <div className="text-xs font-bold text-emerald-500 flex items-center gap-1.5">
                      <span className="w-2 h-2 rounded-full bg-emerald-500 inline-block" />
                      <span>

                      </span>
                    </div>
                  </div>
                </div>

    function TycoonDashboardPage({
      theme,

      goalItemName,
      financialGoal,
      totalTargetRevenue,
      dailySalesTarget,
      breakEvenPoint,
      totalRevenueEarned,
      netProfitEarned,
      hasBrokenEven,
      hasReachedGoal,
      durationDays,
      activeDay,
      setActiveDay,
      salesLog,
      onOpenShiftWrapUp,
      onAddQuickDemoSale,
      onGoRegister,
      onBackHome
    }) {
      const breakEvenPct =
        breakEvenPoint > 0
          ? Math.min(100, Math.round((totalRevenueEarned / breakEvenPoint) * 100))
          : totalRevenueEarned > 0
          ? 100
          : 0;
      const totalGoalPct =
        totalTargetRevenue > 0
          ? Math.min(100, Math.round((totalRevenueEarned / totalTargetRevenue) * 100))
          : 0;

      const chartDays = Array.from({ length: durationDays }, (_, idx) => {
        const dayNum = idx + 1;
        const targetCumulative = Number((dailySalesTarget * dayNum).toFixed(2));
        const actualCumulative = Number(
          salesLog
            .filter((tx) => tx.day <= dayNum)
            .reduce((sum, tx) => sum + tx.total, 0)
            .toFixed(2)
        );
        return {
          day: dayNum,
          targetCumulative,
          actualCumulative: dayNum <= activeDay ? actualCumulative : null
        };
      });

      const maxY = Math.max(totalTargetRevenue, totalRevenueEarned, 10) * 1.15;
      const svgW = 540;
      const svgH = 220;
      const padL = 48;
      const padR = 24;
      const padT = 22;
      const padB = 34;
      const plotW = svgW - padL - padR;
      const plotH = svgH - padT - padB;

      const getX = (idx) =>
        chartDays.length <= 1 ? padL + plotW / 2 : padL + (idx / (chartDays.length - 1)) * plotW;
      const getY = (val) => padT + plotH - (val / maxY) * plotH;

      const targetPoints = chartDays.map((d, i) => `${getX(i)},${getY(d.targetCumulative)}`).join(' ');
      const activePoints = chartDays
        .filter((d) => d.actualCumulative !== null)
        .map((d, i) => `${getX(i)},${getY(d.actualCumulative)}`)
        .join(' ');

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <button
                onClick={onBackHome}
                className={`inline-flex items-center gap-1.5 text-xs font-extrabold px-3 py-1 rounded-full border mb-2 cursor-pointer ${theme.pillBg}`}

    function normalizeLeetForCheck(str) {
      return str
        .toLowerCase()
        .replace(/[@4]/g, 'a')
        .replace(/[3€]/g, 'e')
        .replace(/[1!|]/g, 'i')
        .replace(/[0°]/g, 'o')
        .replace(/[$5]/g, 's')
        .replace(/[7+]/g, 't')
        .replace(/8/g, 'b')
        .replace(/9/g, 'g')
        .replace(/[^a-z\s]/g, '');
    }

    function containsProfanity(text) {
      if (!text) return false;
      const normalized = normalizeLeetForCheck(text);
      const words = normalized.split(/\s+/).filter(Boolean);
      for (const w of words) {
        if (SAFE_WHITELIST.includes(w)) continue;
        const collapsed = w.replace(/(.)\1{2,}/g, '$1');
        if (BANNED_TERMS.includes(w) || BANNED_TERMS.includes(collapsed)) return true;
        for (const bad of BANNED_TERMS) {
          if (bad.length >= 4 && (w.includes(bad) || collapsed.includes(bad))) {
            return true;
          }
        }
      }
      const squished = normalized.replace(/\s+/g, '');
      if (!SAFE_WHITELIST.some((safe) => squished.includes(safe))) {
        for (const bad of BANNED_TERMS) {
          if (bad.length >= 4 && squished.includes(bad)) return true;
        }
      }
      return false;
    }

    function censorKidSafeText(text) {
      if (!text) return '';
      return text
        .split(/(\s+)/)
        .map((token) => {
          if (!token.trim()) return token;
          return containsProfanity(token) ? '⭐'.repeat(Math.min(4, token.trim().length)) : token;
        })
        .join('');
    }

    function playScannerBeep(muted) {
      if (muted || typeof window === 'undefined') return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(1480, ctx.currentTime);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.11);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.11);
      } catch (e) {}
    }

    function playKaChingSound(muted) {
      if (muted || typeof window === 'undefined') return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        [987.77, 1318.51].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.09);
          gain.gain.setValueAtTime(0.12, ctx.currentTime + i * 0.09);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.09 + 0.28);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + i * 0.09);
          osc.stop(ctx.currentTime + i * 0.09 + 0.28);
        });
      } catch (e) {}
    }

    // ============================================================================
    // LIVE OPEN-METEO WEATHER HELPER
    // ============================================================================
    async function fetchLiveLocalWeather() {
      try {
        const res = await fetch(
          'https://api.open-meteo.com/v1/forecast?latitude=40.5187&longitude=-74.4121&current=temperature_2m,weather_code&temperature_unit=fahrenheit'
        );
        if (!res.ok) return null;
        const data = await res.json();
        const tempF = Math.round(data?.current?.temperature_2m ?? 64);
        const code = data?.current?.weather_code ?? 1;
        let condition = 'Partly Cloudy';
        let id = 'cloudy';
        if (code === 0 || code === 1) {
          condition = 'Sunny & Clear';
          id = tempF >= 62 ? 'sunny' : 'cloudy';
        } else if (code >= 51) {
          condition = 'Rainy / Cool';
          id = 'rainy';
        }
        return { tempF, condition, id };
      } catch (e) {
        return null;
      }
    }

        setStepError('');
        if (step === 1) {
          if (!kidName.trim() || !businessName.trim()) {
            setStepError('Please enter your founder name(s) and business name!');
            return;
          }
          if (containsProfanity(kidName) || containsProfanity(businessName)) {
            setStepError('Please use friendly, school-safe names!');
            return;
          }
        }
        if (step === 2) {
          if (parentKnows !== true) {
            setStepError('A parent or guardian must know about your shop before continuing!');
            return;
          }
          if (!parentContact.trim() || parentContact.trim().length < 5) {
            setStepError('Please enter a valid parent/account email or phone number!');
            return;
          }
          if (!accountPassword.trim() || accountPassword.trim().length < 4) {
            setStepError('Please create a password (at least 4 characters) to protect your shop!');
            return;
          }
        }
        if (step === 3 && customMascotName.trim() && containsProfanity(customMascotName)) {
          setStepError('Please choose a friendly assistant name!');
          return;
        }
        if (step === 5) {
          if (!goalItemName.trim() || Number(financialGoal) <= 0) {
            setStepError('Enter what you are saving up for and a goal amount above $0!');
            return;
          }
          if (containsProfanity(goalItemName) || containsProfanity(category)) {
            setStepError('Please choose friendly, school-safe names!');
            return;
          }
        }
        if (step < 6) {
          setStep(step + 1);
        } else {
          onComplete();
        }
      };

      return (
        <div className={`min-h-screen ${theme.bg} ${theme.text} flex items-center justify-center p-4`}>
          <div className={`max-w-xl w-full ${theme.card} border-2 ${theme.cardShadow} rounded-3xl p-6 sm:p-8 space-y-6`}>
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <PixelLogo size={36} />
                <span className="font-black text-lg">Seedling Setup</span>
              </div>
              <span className={`px-3 py-1 rounded-full border text-xs font-black ${theme.accentBadge}`}>
                Step {step} of 6
              </span>
            </div>

            <div className="w-full h-2.5 rounded-full bg-black/10 overflow-hidden">
              <div
                className="h-full bg-emerald-500 transition-all duration-300"
                style={{ width: `${(step / 6) * 100}%` }}
              />
            </div>

            {step === 1 && (
              <div className="space-y-4">
                <h2 className="text-2xl font-black">👋 Who is starting this business?</h2>
                <div>
                  <label className="block text-xs font-extrabold mb-1">Founder Name(s)</label>
                  <input
                    type="text"
                    value={kidName}
                    onChange={(e) => setKidName(censorKidSafeText(e.target.value))}
                    placeholder="e.g. Maya (or Maya & Leo)"
                    className={`w-full px-4 py-3 rounded-2xl border-2 text-sm font-bold ${theme.inputBg}`}
                  />
                </div>
                <div>
                  <label className="block text-xs font-extrabold mb-1">Your Age Group</label>
                  <div className="grid grid-cols-4 gap-2">
                    {['6-7', '8-9', '10-12', '13+'].map((age) => (
                      <button
                        key={age}
                        type="button"
                        onClick={() => setKidAgeGroup(age)}
                        className={`py-2.5 rounded-2xl border-2 text-xs font-black cursor-pointer ${
                          kidAgeGroup === age ? theme.primaryBtn : theme.pillBg
                        }`}
                      >
                        Ages {age}
                      </button>
                    ))}
                  </div>
                </div>
                <div>
                  <label className="block text-xs font-extrabold mb-1">Business Name</label>
                  <input
                    type="text"
                    value={businessName}
                    onChange={(e) => setBusinessName(censorKidSafeText(e.target.value))}
                    placeholder="e.g. Sunset Pop-Up Shop"
                    className={`w-full px-4 py-3 rounded-2xl border-2 text-sm font-bold ${theme.inputBg}`}
                  />
                </div>
              </div>
            )}

            {step === 2 && (
              <div className="space-y-4">
                <h2 className="text-2xl font-black">🛡️ Parent Check & Shop Lock</h2>
                <div>
                  <label className="block text-xs font-extrabold mb-2">
                    Does your parent or guardian know you are setting up this shop?
                  </label>
                  <div className="grid grid-cols-2 gap-3">
                    <button
                      type="button"
                      onClick={() => setParentKnows(true)}
                      className={`py-3 px-4 rounded-2xl border-2 text-xs font-black cursor-pointer ${
                        parentKnows === true ? theme.primaryBtn : theme.pillBg
                      }`}
                    >
                      ✅ Yes! My parent knows
                    </button>
                    <button
                      type="button"
                      onClick={() => setParentKnows(false)}
                      className={`py-3 px-4 rounded-2xl border-2 text-xs font-black cursor-pointer ${
                        parentKnows === false ? 'bg-rose-400 border-rose-600 text-slate-950' : theme.pillBg
                      }`}
                    >
                      ❌ Not yet
                    </button>
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-extrabold mb-1">Account Email or Phone</label>
                  <div className="flex gap-2 mb-2">
                    {['email', 'phone'].map((m) => (
                      <button
                        key={m}
                        type="button"
                        onClick={() => setContactMethod(m)}
                        className={`px-3 py-1 rounded-full border text-xs font-black capitalize cursor-pointer ${
                          contactMethod === m ? theme.secondaryBtn : theme.pillBg
                        }`}
                      >
                        {m}
                      </button>
                    ))}
                  </div>
                  <input
                    type={contactMethod === 'email' ? 'email' : 'tel'}
                    value={parentContact}
                    onChange={(e) => setParentContact(e.target.value)}
                    placeholder={contactMethod === 'email' ? 'parent@email.com' : '(555) 123-4567'}
                    className={`w-full px-4 py-3 rounded-2xl border-2 text-sm font-bold ${theme.inputBg}`}
                  />
                </div>

                <div>
                  <label className="block text-xs font-extrabold mb-1">Create Shop Password</label>
                  <input
                    type="password"
                    value={accountPassword}
                    onChange={(e) => setAccountPassword(e.target.value)}
                    placeholder="At least 4 characters"
                    className={`w-full px-4 py-3 rounded-2xl border-2 text-sm font-bold ${theme.inputBg}`}
                  />
                </div>
              </div>
            )}

            {step === 3 && (
              <div className="space-y-4">
                <h2 className="text-2xl font-black">🌱 Pick & Name Your AI Veggie Buddy</h2>
                <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                  {MASCOTS.map((m) => (
                    <button
                      key={m.id}
                      type="button"
                      onClick={() => setMascotId(m.id)}
                      className={`p-3.5 rounded-2xl border-2 flex flex-col items-center text-center gap-1.5 cursor-pointer ${
                        mascotId === m.id ? `${theme.primaryBtn}` : theme.innerCream
                      }`}
                    >
                      <PixelMascot type={m.id} size={52} />
                      <div className="font-black text-xs">{m.shortName}</div>
                      <div className="text-[10px] opacity-80">{m.vibe}</div>
                    </button>
                  ))}
                </div>
                <div>
                  <label className="block text-xs font-extrabold mb-1">
                    Custom Assistant Name (Optional)
                  </label>
                  <input
                    type="text"
                    value={customMascotName}
                    onChange={(e) => setCustomMascotName(censorKidSafeText(e.target.value))}
                    placeholder="Give your buddy a custom name..."
                    className={`w-full px-4 py-2.5 rounded-2xl border-2 text-sm font-bold ${theme.inputBg}`}
                  />
                </div>
              </div>
            )}

            {step === 4 && (
              <div className="space-y-4">
                <h2 className="text-2xl font-black">🎨 Pick Your Shop Theme</h2>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  {Object.values(THEMES).map((t) => (
                    <button
                      key={t.id}
                      type="button"
                      onClick={() => setThemeId(t.id)}
                      className={`p-3.5 rounded-2xl border-2 flex items-center gap-3 text-left cursor-pointer ${
                        themeId === t.id ? theme.primaryBtn : theme.innerCream
                      }`}
                    >
                      <span
                        className="w-7 h-7 rounded-full border-2 border-black/20 shrink-0"
                        style={{ backgroundColor: t.swatch }}
                      />
                      <span className="font-black text-sm">{t.name}</span>
                    </button>
                  ))}
                </div>
              </div>
            )}

            {step === 5 && (
              <div className="space-y-4">
                <h2 className="text-2xl font-black">🎯 Your Savings Goal & Supplies</h2>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-extrabold mb-1">What are you saving for?</label>
                    <input
                      type="text"
                      value={goalItemName}
                      onChange={(e) => setGoalItemName(censorKidSafeText(e.target.value))}
                      placeholder="e.g. Video Game, Bike"
                      className={`w-full px-3.5 py-2.5 rounded-2xl border-2 text-sm font-bold ${theme.inputBg}`}
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-extrabold mb-1">Shop Category</label>
                    <input
                      type="text"
                      value={category}
                      onChange={(e) => setCategory(censorKidSafeText(e.target.value))}
                      placeholder="Type your category..."
                      className={`w-full px-3.5 py-2.5 rounded-2xl border-2 text-sm font-bold ${theme.inputBg}`}
                    />
                  </div>
                </div>

                <div className="grid grid-cols-3 gap-2.5">
                  <div>
                    <label className="block text-xs font-extrabold mb-1">Goal Amount ($)</label>
                    <input
                      type="number"
                      min="1"
                      value={financialGoal || ''}
                      onChange={(e) => setFinancialGoal(Math.max(0, Number(e.target.value)))}
                      placeholder="50"
                      className={`w-full px-3 py-2.5 rounded-2xl border-2 text-sm font-black ${theme.inputBg}`}
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-extrabold mb-1">Days Open</label>
                    <input
                      type="number"
                      min="1"
                      max="30"
                      value={durationDays}
                      onChange={(e) => setDurationDays(Math.max(1, Number(e.target.value)))}
                      className={`w-full px-3 py-2.5 rounded-2xl border-2 text-sm font-black ${theme.inputBg}`}
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-extrabold mb-1">Supply Cost ($)</label>
                    <input
                      type="number"
                      min="0"
                      value={materialCost || ''}
                      onChange={(e) => setMaterialCost(Math.max(0, Number(e.target.value)))}
                      placeholder="15"
                      className={`w-full px-3 py-2.5 rounded-2xl border-2 text-sm font-black ${theme.inputBg}`}
                    />
                  </div>
                </div>

                <div className={`p-3.5 rounded-2xl border ${theme.innerCream} grid grid-cols-3 gap-2 text-center`}>
                  <div>
                    <div className="text-[10px] font-extrabold uppercase opacity-75">Break-Even</div>
                    <div className="text-base font-black text-amber-500">${breakEvenPoint.toFixed(2)}</div>
                  </div>
                  <div>
                    <div className="text-[10px] font-extrabold uppercase opacity-75">Total Target</div>
                    <div className="text-base font-black text-emerald-500">${totalTargetRevenue.toFixed(2)}</div>
                  </div>
                  <div>
                    <div className="text-[10px] font-extrabold uppercase opacity-75">Daily Goal</div>
                    <div className="text-base font-black text-sky-500">${dailySalesTarget.toFixed(2)}</div>
                  </div>
                </div>
              </div>
            )}

            {step === 6 && (
              <div className="space-y-4">
                <div>
                  <h2 className="text-2xl font-black">🚀 Your Complete Seedling Tutorial</h2>
                  <p className={`text-xs sm:text-sm mt-1 ${theme.mutedText}`}>
                    Here is how every part of your shop works. You can reopen this guide anytime with the Tutorial button.
                  </p>
                </div>
                <div className="max-h-[48vh] overflow-y-auto seedling-scroll space-y-3 pr-1">
                  {TUTORIAL_CHAPTERS.map((chapter, index) => (
                    <section key={chapter.title} className={`p-3.5 rounded-2xl border ${theme.innerCream}`}>
                      <h3 className="font-black text-sm">{index + 1}. {chapter.icon} {chapter.title}</h3>
                      <p className="text-xs mt-1">{chapter.summary}</p>
                      <ul className="mt-2 space-y-1.5 text-xs list-disc pl-5">
                        {chapter.bullets.map((bullet) => <li key={bullet}>{bullet}</li>)}
                      </ul>
                    </section>
                  ))}
                </div>
              </div>
            )}

            {stepError && <div className="text-xs font-black text-rose-500">{stepError}</div>}

            <div className="flex items-center justify-between pt-2">
              {step > 1 ? (
                <button
                  type="button"
                  onClick={() => {
                    setStepError('');
                    setStep(step - 1);
                  }}
                  className={`px-5 py-2.5 rounded-full border font-extrabold text-xs cursor-pointer ${theme.pillBg}`}
                >
                  ← Back
                </button>
              ) : (
                <div />
              )}

              <button
                type="button"
                onClick={validateAndNext}
                className={`px-6 py-3 rounded-full border-2 font-black text-sm cursor-pointer ${theme.primaryBtn}`}
              >
                {step === 6 ? 'Launch My Shop! 🚀' : 'Next Step →'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================================
    // ANIMATED FLOATING CORNER MASCOT COMPANION
    // ============================================================================
    function FloatingMascotCompanion({
      theme,
      mascot,
      assistantDisplayName,
      kidName,
      chatMessages,
      isAiTyping,
      onSendChat
    }) {
      const [isOpen, setIsOpen] = useState(false);
      const [miniInput, setMiniInput] = useState('');

      return (
        <div className="fixed bottom-4 right-4 z-40 flex flex-col items-end gap-2">
          {isOpen && (
            <div className={`w-72 sm:w-80 ${theme.card} border-2 ${theme.cardShadow} rounded-3xl p-4 space-y-3`}>
              <div className="flex items-center justify-between border-b border-black/10 pb-2">
                <div className="font-black text-xs">{assistantDisplayName} Quick Chat</div>
                <button
                  type="button"
                  onClick={() => setIsOpen(false)}
                  className="text-xs font-black opacity-70 hover:opacity-100 cursor-pointer"
                >
                  ✕
                </button>
              </div>
              <div className="max-h-44 overflow-y-auto seedling-scroll space-y-2 text-xs">
                {chatMessages.length === 0 ? (
                  <div className={`p-2.5 rounded-2xl border ${theme.innerCream}`}>
                    Hi {kidName}! Need a quick pricing or bundle tip? Ask me!
                  </div>
                ) : (
                  chatMessages.slice(-4).map((m) => (
                    <div
                      key={m.id}
                      className={`p-2.5 rounded-2xl ${
                        m.role === 'user' ? `${theme.primaryBtn} font-bold ml-6` : `${theme.innerCream} border mr-6`
                      }`}
                    >
                      {m.text}
                    </div>
                  ))
                )}
              </div>
              <form
                onSubmit={(e) => {
                  e.preventDefault();
                  if (!miniInput.trim() || isAiTyping) return;
                  onSendChat(miniInput);
                  setMiniInput('');
                }}
                className="flex gap-1.5"
              >
                <input
                  type="text"
                  value={miniInput}
                  onChange={(e) => setMiniInput(e.target.value)}
                  placeholder="Ask a quick question..."
                  className={`flex-1 px-3 py-2 rounded-full border text-xs font-bold outline-none ${theme.inputBg}`}
                />
                <button
                  type="submit"
                  disabled={isAiTyping || !miniInput.trim()}
                  className={`px-3.5 py-2 rounded-full border font-black text-xs cursor-pointer ${theme.primaryBtn}`}
                >
                  Go
                </button>
              </form>
            </div>
          )}

          <button
            type="button"
            onClick={() => setIsOpen(!isOpen)}
            title={`Chat with ${assistantDisplayName}`}
            className="group flex items-center gap-2 cursor-pointer"
          >
            <span className={`hidden sm:inline-block px-3 py-1.5 rounded-full border-2 text-xs font-black shadow-md ${theme.card}`}>
              💬 Ask {assistantDisplayName}
            </span>
            <PixelMascot type={mascot.id} size={58} circular isTalking={isAiTyping} />
          </button>
        </div>
      );
    }

    function TutorialModal({ theme, onClose, onNavigate }) {
      const [chapterIndex, setChapterIndex] = useState(0);
      const chapter = TUTORIAL_CHAPTERS[chapterIndex];

      useEffect(() => {
        const handleKeyDown = (event) => {
          if (event.key === 'Escape') onClose();
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [onClose]);

      return (
        <div
          className="fixed inset-0 z-[60] bg-slate-950/60 p-3 sm:p-6 flex items-center justify-center"
          onMouseDown={(event) => {
            if (event.target === event.currentTarget) onClose();
          }}
        >
          <section
            role="dialog"
            aria-modal="true"
            aria-labelledby="tutorial-title"
            className={`w-full max-w-3xl max-h-[92vh] overflow-y-auto seedling-scroll ${theme.card} border-2 ${theme.cardShadow} rounded-3xl p-5 sm:p-7`}
          >
            <header className="flex items-start justify-between gap-4">
              <div>
                <div className={`text-xs font-black uppercase tracking-wide ${theme.mutedText}`}>
                  Seedling tutorial · {chapterIndex + 1} of {TUTORIAL_CHAPTERS.length}
                </div>
                <h2 id="tutorial-title" className="text-2xl sm:text-3xl font-black mt-1">
                  {chapter.icon} {chapter.title}
                </h2>
              </div>
              <button
                type="button"
                onClick={onClose}
                aria-label="Close tutorial"
                className={`shrink-0 p-2 rounded-full border font-black cursor-pointer ${theme.pillBg}`}
              >
                <X className="w-4 h-4" />
              </button>
            </header>

            <div className="mt-4 flex gap-1.5 overflow-x-auto pb-2" aria-label="Tutorial chapters">
              {TUTORIAL_CHAPTERS.map((item, index) => (
                <button
                  key={item.title}
                  type="button"
                  onClick={() => setChapterIndex(index)}
                  aria-label={`Go to chapter ${index + 1}: ${item.title}`}
                  aria-current={index === chapterIndex ? 'step' : undefined}
                  className={`shrink-0 px-3 py-1.5 rounded-full border text-xs font-black cursor-pointer ${
                    index === chapterIndex ? theme.primaryBtn : theme.pillBg
                  }`}
                >
                  {index + 1}. {item.icon}
                </button>
              ))}
            </div>

            <div className={`mt-3 p-4 sm:p-5 rounded-2xl border ${theme.innerCream}`}>
              <p className="font-bold text-sm sm:text-base">{chapter.summary}</p>
              <ul className="mt-4 space-y-3 text-sm list-disc pl-5">
                {chapter.bullets.map((bullet) => <li key={bullet}>{bullet}</li>)}
              </ul>
              {chapter.tab && (
                <button
                  type="button"
                  onClick={() => {
                    onNavigate(chapter.tab);
                    onClose();
                  }}
                  className={`mt-5 px-4 py-2.5 rounded-full border-2 text-xs font-black cursor-pointer ${theme.primaryBtn}`}
                >
                  Open {chapter.tab === 'pos' ? 'Register' : chapter.tab === 'dashboard' ? 'Tycoon Board' : chapter.tab === 'setup' ? 'Goal & Menu' : chapter.tab === 'coach' ? 'AI Coach' : 'Home'} →
                </button>
              )}
            </div>

            <footer className="mt-4 flex items-center justify-between gap-3">
              <button
                type="button"
                onClick={() => setChapterIndex((current) => Math.max(0, current - 1))}
                disabled={chapterIndex === 0}
                className={`px-4 py-2.5 rounded-full border text-xs font-black cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed ${theme.pillBg}`}
              >
                ← Previous
              </button>
              <button
                type="button"
                onClick={() => {
                  if (chapterIndex === TUTORIAL_CHAPTERS.length - 1) onClose();
                  else setChapterIndex((current) => current + 1);
                }}
                className={`px-5 py-2.5 rounded-full border-2 text-xs font-black cursor-pointer ${theme.primaryBtn}`}
              >
                {chapterIndex === TUTORIAL_CHAPTERS.length - 1 ? 'Finish Tutorial ✓' : 'Next Chapter →'}
              </button>
            </footer>
          </section>
        </div>
      );
    }

    // ============================================================================
    // MAIN APPLICATION COMPONENT

    function App() {
      const saved = useMemo(() => {
        try {
          const raw = window.localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch (e) {
          return null;
        }
      }, []);

      // Navigation & App Shell State
      const [hasCompletedOnboarding, setHasCompletedOnboarding] = useState(
        saved?.hasCompletedOnboarding ?? false
      );
      const [onboardingStep, setOnboardingStep] = useState(saved?.onboardingStep ?? 1);
      const [activeTab, setActiveTab] = useState(saved?.activeTab ?? 'home');
      const [soundMuted, setSoundMuted] = useState(saved?.soundMuted ?? false);
      const [shopOpen, setShopOpen] = useState(saved?.shopOpen ?? true);
      const [saveBadgeText, setSaveBadgeText] = useState('Saved ✓');

      const [loginPasswordInput, setLoginPasswordInput] = useState('');

      const [tycoonGems, setTycoonGems] = useState(saved?.tycoonGems ?? 0);

      const [activeDay, setActiveDay] = useState(saved?.activeDay ?? 1);

      const [cart, setCart] = useState([]);

      const [cashTendered, setCashTendered] = useState('');

      const [liveWeatherInfo, setLiveWeatherInfo] = useState({ tempF: 64, condition: 'Partly Cloudy' });

      // Real Shop Math Metrics
      const totalTargetRevenue = Number((Number(financialGoal) + Number(materialCost)).toFixed(2));
      const dailySalesTarget = Number((totalTargetRevenue / Math.max(1, Number(durationDays))).toFixed(2));
      const breakEvenPoint = Number(Number(materialCost).toFixed(2));

      const totalRevenueEarned = useMemo(
        () => Number(salesLog.reduce((sum, tx) => sum + tx.total, 0).toFixed(2)),
        [salesLog]
      );

      const netProfitEarned = Number((totalRevenueEarned - breakEvenPoint).toFixed(2));
      const hasBrokenEven =
        breakEvenPoint > 0 ? totalRevenueEarned >= breakEvenPoint : totalRevenueEarned > 0;
      const hasReachedGoal = totalTargetRevenue > 0 && totalRevenueEarned >= totalTargetRevenue;

      // Simple, 100% Real Shop Forecast & Pricing Tips (No Fake Numbers)
      const shopInsights = useMemo(() => {
        const weatherObj = WEATHER_OPTIONS.find((w) => w.id === forecastWeather) || WEATHER_OPTIONS[1];
        const dowObj = DAY_OF_WEEK_OPTIONS.find((d) => d.id === forecastDow) || DAY_OF_WEEK_OPTIONS[0];

        const avgSellingPrice =
          products.length > 0
            ? Number((products.reduce((sum, p) => sum + p.price, 0) / products.length).toFixed(2))
            : 2.5;
        const avgUnitCost =
          products.length > 0
            ? Number((products.reduce((sum, p) => sum + p.unitCost, 0) / products.length).toFixed(2))
            : 0.5;
        const avgMarginPerItem = Math.max(0.25, Number((avgSellingPrice - avgUnitCost).toFixed(2)));

        const activeSellingDays = new Set(salesLog.map((tx) => tx.day)).size;
        const totalLoggedUnits = salesLog.reduce((sum, tx) => sum + (tx.unitsCount || 1), 0);
        const avgLoggedUnitsPerDay =
          activeSellingDays > 0 ? Number((totalLoggedUnits / activeSellingDays).toFixed(1)) : null;

        const unitsNeededPerDayForGoal = Math.max(
          1,
          Math.ceil(dailySalesTarget / Math.max(0.5, avgSellingPrice))
        );

        const baseEstimate = avgLoggedUnitsPerDay !== null ? avgLoggedUnitsPerDay : unitsNeededPerDayForGoal;
        const tomorrowPredictedUnits = Math.max(
          1,
          Math.round(baseEstimate * weatherObj.demandMult * dowObj.demandMult)
        );

        const recommendedPrice = Number(
          (weatherObj.id === 'sunny' && dowObj.demandMult >= 1.2
            ? avgSellingPrice + 0.25
            : avgSellingPrice
          ).toFixed(2)
        );

        const priceAction =
          recommendedPrice > avgSellingPrice
            ? `Try +$0.25 ($${recommendedPrice.toFixed(2)}) for peak demand`
            : `Keep menu around $${avgSellingPrice.toFixed(2)}`;

        const tips = [
          `Bundle Boost: Keep it up, ${displayKidName}! Selling 2 different products or 3+ total units unlocks the Bundle Master badge!`,
          avgLoggedUnitsPerDay !== null
            ? `Real Pace Check: You've averaged ${avgLoggedUnitsPerDay} units/day across ${activeSellingDays} selling day(s) ($${totalRevenueEarned.toFixed(2)} earned so far).`
            : `Goal Pace: At ~$${avgSellingPrice.toFixed(2)} per item, selling ${unitsNeededPerDayForGoal} item(s)/day hits your $${dailySalesTarget.toFixed(2)} daily target!`,
          `Goal Sign Trick: Write "Saving $${financialGoal} for ${displayGoalItem}!" on your table sign—neighbors love supporting a real goal!`
        ];

        return {
          weatherObj,
          dowObj,
          avgSellingPrice,
          avgUnitCost,
          avgMarginPerItem,
          activeSellingDays,
          totalLoggedUnits,
          avgLoggedUnitsPerDay,
          unitsNeededPerDayForGoal,
          tomorrowPredictedUnits,
          recommendedPrice,
          priceAction,
          tips
        };
      }, [

      ]);

      const theme = THEMES[themeId] || THEMES.mint;

      // Send message to AI Coach
      const handleSendChat = async (textToSend) => {
        const cleanText = (textToSend || '').trim();
        if (!cleanText) return;

        const hadBadWords = containsProfanity(cleanText);
        const censoredUserText = censorKidSafeText(cleanText);
        const userMsg = { id: `u-${Date.now()}-${Math.random()}`, role: 'user', text: censoredUserText };
        setChatMessages((prev) => [...prev, userMsg]);

        if (hadBadWords) {
          setChatMessages((prev) => [
            ...prev,
            {
              id: `ai-${Date.now()}-${Math.random()}`,
              role: 'ai',
              text: `Whoa there, ${displayKidName}! Let's keep our shop super friendly and positive. Ask me about cool bundles, signs, or prices!`
            }
          ]);
          return;
        }

        setIsAiTyping(true);

        const systemPrompt = `You are ${assistantDisplayName}, an enthusiastic, warm, kid-friendly AI Business Coach inside Seedling for young entrepreneurs ages 6-12.
Keep replies SHORT, fun, and easy to read (2-3 crisp sentences max). Use simple words and encouraging energy.
CRITICAL SAFETY RULE: Never output profanity, crude slang, or adult topics. Always stay 100% G-rated and positive for kids.
Live Shop Data:
- Founder: ${displayKidName} (Age ${kidAgeGroup})
- Shop Name: "${displayShopName}"${category ? ` (${category})` : ''}
- Saving For: "${displayGoalItem}" ($${financialGoal} goal, $${materialCost} supplies, ${durationDays} days)
- Break-Even: $${breakEvenPoint.toFixed(2)} | Total Target: $${totalTargetRevenue.toFixed(2)} | Daily Target: $${dailySalesTarget.toFixed(2)}/day
- Earned So Far: $${totalRevenueEarned.toFixed(2)} (${shopInsights.totalLoggedUnits} units sold)
- Live Local Weather: ${liveWeatherInfo.tempF}°F (${liveWeatherInfo.condition})
- Products in Menu: ${products.map((p) => `${censorKidSafeText(p.name)} ($${p.price.toFixed(2)})`).join(', ') || 'None added yet'}`;

        let replyText = '';

        // 1. Try Gemini Flash API first
        try {
          const apiKey = '';
          const geminiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 5000);
          const res = await fetch(geminiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            signal: controller.signal,
            body: JSON.stringify({
              systemInstruction: { parts: [{ text: systemPrompt }] },
              contents: [
                ...chatMessages.slice(-4).map((m) => ({
                  role: m.role === 'user' ? 'user' : 'model',
                  parts: [{ text: censorKidSafeText(m.text) }]
                })),
                { role: 'user', parts: [{ text: censoredUserText }] }
              ]
            })
          });
          clearTimeout(timeoutId);
          if (res.ok) {
            const data = await res.json();
            const candidateText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
            if (candidateText) {
              replyText = censorKidSafeText(candidateText.trim());
              setAiEngineStatus('AI Coach Ready');
            }
          }
        } catch (err) {}

        // 2. Try local Ollama server if Gemini wasn't available
        if (!replyText) {
          try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 2000);
            const res = await fetch(ollamaUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              signal: controller.signal,
              body: JSON.stringify({
                model: ollamaModel || 'llama3.2',
                stream: false,
                messages: [
                  { role: 'system', content: systemPrompt },
                  { role: 'user', content: censoredUserText }
                ]
              })
            });
            clearTimeout(timeoutId);
            if (res.ok) {
              const data = await res.json();
              const ollamaReply = data?.message?.content || data?.response;
              if (ollamaReply) {
                replyText = censorKidSafeText(ollamaReply.trim());
                setAiEngineStatus(`Ollama (${ollamaModel})`);
              }
            }
          } catch (err) {}
        }

        // 3. Guaranteed Smart Local Coach Response
        if (!replyText) {
          setAiEngineStatus('AI Coach Ready');
          const lower = censoredUserText.toLowerCase();
          if (lower.includes('weather') || lower.includes('temp') || lower.includes('outside')) {
            replyText = `It's currently ${liveWeatherInfo.tempF}°F (${liveWeatherInfo.condition}) outside! ${
              liveWeatherInfo.tempF >= 68
                ? 'Refreshing cold drinks and fruity treats are super popular in warm weather!'
                : 'Cozy drinks, baked treats, and fun crafts sell awesome in mild or cool weather!'
            }`;
          } else if (lower.includes('price') || lower.includes('cost') || lower.includes('charge')) {
            replyText = `Your average menu price is $${shopInsights.avgSellingPrice.toFixed(2)} (earning ~$${shopInsights.avgMarginPerItem.toFixed(2)} profit per sale). Selling ${shopInsights.unitsNeededPerDayForGoal} items/day keeps you right on track for $${dailySalesTarget.toFixed(2)}/day!`;
          } else if (lower.includes('sign') || lower.includes('poster') || lower.includes('ad')) {
            replyText = `Write: "Fresh Deals at ${displayShopName}! Help ${displayKidName} earn $${financialGoal} for ${displayGoalItem}!" Big colorful letters bring way more neighbors over!`;
          } else if (lower.includes('bundle') || lower.includes('combo') || lower.includes('badge')) {
            replyText = `Try a "Bestie Combo"—sell 2 different items together for $0.50 off! You’ll unlock the Bundle Master badge and hit your $${dailySalesTarget.toFixed(2)} daily target faster.`;
          } else if (
            lower.includes('not have') ||
            lower.includes("don't have") ||
            lower.includes('dont have') ||
            lower.includes('add') ||
            lower.includes('missing')
          ) {
            const suggestions =
              liveWeatherInfo.tempF >= 68
                ? ['Strawberry Lemonade (~$2.50)', 'Mango Agua Fresca (~$3.00)', 'Friendship Bracelets (~$3.50)']
                : ['Warm Chocolate Chip Cookies (~$2.50)', 'Spiced Chai or Cocoa (~$3.00)', 'Handmade Stickers or Bracelets (~$3.50)'];
            replyText = `Here are 3 fun items not on your menu yet that fit ${liveWeatherInfo.tempF}°F weather: ${suggestions.join('; ')}. Add any of them in your Menu Builder!`;
          } else if (lower.includes('hi') || lower.includes('hello') || lower.includes('hey')) {
            replyText = `Hey ${displayKidName}! Ready to rock ${displayShopName}? You've earned $${totalRevenueEarned.toFixed(2)} so far—ask me for a pricing, sign, or bundle idea!`;
          } else {
            replyText = `Great question, ${displayKidName}! You've earned $${totalRevenueEarned.toFixed(2)} toward your $${totalTargetRevenue.toFixed(2)} goal (${shopInsights.totalLoggedUnits} units logged)—try offering a 2-item combo today!`;
          }
        }

        setChatMessages((prev) => [
          ...prev,
          { id: `ai-${Date.now()}-${Math.random()}`, role: 'ai', text: censorKidSafeText(replyText) }
        ]);
        setIsAiTyping(false);

      // POS Functions
      const addItemToCart = (product) => {
        playScannerBeep(soundMuted);
        setCart((prev) => {
          const existing = prev.find((item) => item.id === product.id);
          if (existing) {
            return prev.map((item) =>
              item.id === product.id ? { ...item, qty: item.qty + 1 } : item
            );
          }
          return [...prev, { ...product, qty: 1 }];

      };

      const handleBarcodeSubmit = (codeToScan) => {
        const cleanCode = (codeToScan || barcodeInput).trim().padStart(3, '0');
        const found = products.find((p) => p.barcode === cleanCode);
        if (found) {

          });

        setTimeout(() => setPosBanner(null), 2600);

      const updateCartQty = (id, delta) => {
        setCart((prev) =>
          prev
            .map((item) => (item.id === id ? { ...item, qty: item.qty + delta } : item))
            .filter((item) => item.qty > 0)

      const cartItemsTotal = useMemo(
        () => Number(cart.reduce((sum, item) => sum + item.price * item.qty, 0).toFixed(2)),

      );

      const cartSubtotal = Number((cartItemsTotal + Number(tipAmount || 0)).toFixed(2));

      const cartCostTotal = useMemo(
        () => Number(cart.reduce((sum, item) => sum + item.unitCost * item.qty, 0).toFixed(2)),
        [cart]
      );

      const changeDue = useMemo(() => {
        const paid = parseFloat(cashTendered);
        if (isNaN(paid) || paid < cartSubtotal) return null;
        return Number((paid - cartSubtotal).toFixed(2));

      const completeSale = () => {
        if (cart.length === 0) return;
        playKaChingSound(soundMuted);

        const distinctCount = cart.length;
        const unitsCount = cart.reduce((sum, i) => sum + i.qty, 0);
        const isBundleSale = distinctCount >= 2 || unitsCount >= 3;

        const itemsSummary =
          cart.map((i) => `${i.qty}x ${i.name}`).join(', ') +
          (tipAmount > 0 ? ` (+$${tipAmount.toFixed(2)} Tip)` : '');
        const now = new Date();
        const timestamp = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        const newTx = {
          id: `tx-${Date.now()}`,
          day: activeDay,
          timestamp,
          itemsSummary,
          unitsCount,
          tip: Number(tipAmount || 0),
          total: cartSubtotal,
          profit: Number((cartSubtotal - cartCostTotal).toFixed(2))
        };

        setSalesLog((prev) => [newTx, ...prev]);
        setTycoonGems((g) => g + (isBundleSale ? 10 : 5));

        if (isBundleSale) {

          setEarnedBadges((prev) =>
            prev.includes('Bundle Master') ? prev : [...prev, 'Bundle Master']
          );
          setTimeout(() => setShowConfetti(false), 3800);

        setCart([]);
        setTipAmount(0);
        setCashTendered('');
        setPosBanner({
          type: 'success',
          text: isBundleSale

        setTimeout(() => setPosBanner(null), 3800);

            <div className={`max-w-md w-full ${theme.card} border-2 ${theme.cardShadow} rounded-3xl p-7 text-center space-y-5`}>

                  🔒 Shop Protected
                </span>
                <h1 className="text-2xl font-black mt-2">{displayShopName}</h1>
                <p className={`text-xs mt-1 ${theme.mutedText}`}>
                  Enter your password ({parentContact}) to unlock {displayKidName}’s shop.
                </p>
              </div>
              <form
                onSubmit={(e) => {
                  e.preventDefault();
                  if (loginPasswordInput === accountPassword) {
                    setIsLocked(false);
                    setLoginPasswordInput('');
                    setLoginError('');
                  } else {
                    setLoginError('Wrong password! Try again.');
                  }
                }}
                className="space-y-3"
              >
                <input
                  type="password"
                  value={loginPasswordInput}
                  onChange={(e) => setLoginPasswordInput(e.target.value)}
                  placeholder="Enter saved password"
                  className={`w-full px-4 py-3 rounded-2xl border-2 text-sm font-bold outline-none ${theme.inputBg}`}
                />
                {loginError && <div className="text-xs font-black text-rose-500">{loginError}</div>}

      theme,
      businessName,
      setBusinessName,
      category,
      setCategory,
      goalItemName,
      setGoalItemName,
      financialGoal,
      setFinancialGoal,
      durationDays,
      setDurationDays,
      materialCost,
      setMaterialCost,
      totalTargetRevenue,
      dailySalesTarget,
      breakEvenPoint,
      products,
      setProducts,
      onNext,
      onBackHome
    }) {
      const [newItemName, setNewItemName] = useState('');
      const [newItemPrice, setNewItemPrice] = useState('');
      const [newItemCost, setNewItemCost] = useState('');
      const [isGeneratingImg, setIsGeneratingImg] = useState(false);
      const [itemError, setItemError] = useState('');

      const handleAddProduct = async (e) => {
        e.preventDefault();
        if (isGeneratingImg) return;
        setItemError('');

        const rawName = newItemName.trim();
        const priceNum = parseFloat(newItemPrice);
        const costNum = parseFloat(newItemCost) || 0.25;

        if (!rawName || isNaN(priceNum) || priceNum <= 0) {
          setItemError('Enter an item name and selling price!');
          return;
        }
        if (containsProfanity(rawName)) {
          setItemError('Keep product names friendly for all customers!');
          return;
        }

        const cleanName = censorKidSafeText(rawName);
        setIsGeneratingImg(true);
        const aiCartoonUrl = await generateCartoonProductImage(cleanName);

        const nextBarcode = String(products.length + 1).padStart(3, '0');
        setProducts((prev) => [
          ...prev,
          {
            id: `prod-${Date.now()}`,
            barcode: nextBarcode,
            name: cleanName,
            price: Number(priceNum.toFixed(2)),
            unitCost: Number(costNum.toFixed(2)),
            imageUrl: aiCartoonUrl,
            emoji: '🛍️'
          }
        ]);

        setNewItemName('');
        setNewItemPrice('');
        setNewItemCost('');
        setIsGeneratingImg(false);
      };

      const handleDeleteProduct = (id) => {
        setProducts((prev) =>
          prev
            .filter((item) => item.id !== id)
            .map((item, idx) => ({ ...item, barcode: String(idx + 1).padStart(3, '0') }))
        );
      };

        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">

              <button
                onClick={onBackHome}
                className={`inline-flex items-center gap-1.5 text-xs font-extrabold px-3 py-1 rounded-full border mb-2 cursor-pointer ${theme.pillBg}`}
              >
                <ArrowLeft className="w-3.5 h-3.5" />
                <span>Back to Home Hub</span>
              </button>
              <h1 className="text-2xl sm:text-3xl font-black">Smart Goal & Menu Builder</h1>
            </div>

            <button
              onClick={onNext}
              className={`inline-flex items-center justify-center gap-2 px-5 py-3 rounded-full border-2 font-black text-sm cursor-pointer ${theme.primaryBtn}`}

              <span>Ask AI Coach</span>
              <ArrowRight className="w-4 h-4" />

            <div className={`lg:col-span-5 ${theme.card} border-2 ${theme.cardShadow} rounded-3xl p-6 space-y-4`}>

              <div className="space-y-3">
                <div>
                  <label className="block text-xs font-extrabold mb-1">Business Name</label>
                  <input
                    type="text"
                    value={businessName}
                    onChange={(e) => setBusinessName(censorKidSafeText(e.target.value))}
                    placeholder="My Pop-Up Shop"
                    className={`w-full px-3.5 py-2.5 rounded-2xl border-2 text-sm font-bold ${theme.inputBg}`}
                  />
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-extrabold mb-1">Category</label>

                      type="text"
                      value={category}
                      onChange={(e) => setCategory(censorKidSafeText(e.target.value))}
                      placeholder="Type your category..."
                      className={`w-full px-3.5 py-2.5 rounded-2xl border-2 text-sm font-bold ${theme.inputBg}`}
                    />

                  <div>
                    <label className="block text-xs font-extrabold mb-1">Saving Up For</label>

                      value={goalItemName}
                      onChange={(e) => setGoalItemName(censorKidSafeText(e.target.value))}

                      className={`w-full px-3.5 py-2.5 rounded-2xl border-2 text-sm font-bold ${theme.inputBg}`}

                </div>

                <div className="grid grid-cols-3 gap-2.5">

                    <label className="block text-[11px] font-extrabold mb-1">Profit Goal ($)</label>

                      min="0"
                      value={financialGoal}

                  <div>

                      type="number"

                  <div>

            <div className={`lg:col-span-7 ${theme.card} border-2 ${theme.cardShadow} rounded-3xl p-6 space-y-4`}>

              <form onSubmit={handleAddProduct} className="grid grid-cols-1 sm:grid-cols-12 gap-2.5">
                <input
                  type="text"
                  disabled={isGeneratingImg}
                  value={newItemName}
                  onChange={(e) => setNewItemName(censorKidSafeText(e.target.value))}
                  placeholder="Item (e.g. Boba, Empanada, Churro, Lemonade)"

                />
                <input
                  type="number"
                  step="0.25"
                  min="0.25"
                  disabled={isGeneratingImg}
                  value={newItemPrice}
                  onChange={(e) => setNewItemPrice(e.target.value)}
                  placeholder="Price ($)"
                  className={`sm:col-span-2 px-3.5 py-2.5 rounded-2xl border-2 text-sm font-black ${theme.inputBg}`}
                />
                <input
                  type="number"
                  step="0.05"
                  min="0"
                  disabled={isGeneratingImg}
                  value={newItemCost}
                  onChange={(e) => setNewItemCost(e.target.value)}
                  placeholder="Cost ($)"
                  className={`sm:col-span-2 px-3.5 py-2.5 rounded-2xl border-2 text-sm font-bold ${theme.inputBg}`}
                />
                <button
                  type="submit"
                  disabled={isGeneratingImg}
                  className={`sm:col-span-3 py-2.5 px-4 rounded-2xl border-2 font-black text-xs cursor-pointer ${theme.primaryBtn}`}

                      className={`p-3 rounded-2xl border flex items-center justify-between gap-2 ${theme.innerCream}`}

                      <div className="flex items-center gap-3">
                        <span className="px-2 py-0.5 rounded bg-slate-900 text-amber-300 font-mono text-xs font-bold">
                          {prod.barcode}
                        </span>
                        {prod.imageUrl ? (
                          <div className="w-14 h-14 rounded-2xl bg-gradient-to-br from-sky-50 via-amber-50 to-emerald-50 p-1 shadow-xs flex-shrink-0 overflow-hidden">
                            <img
                              src={prod.imageUrl}
                              alt={prod.name}
                              className="w-full h-full object-cover rounded-xl"
                            />
                          </div>
                        ) : (
                          <span className="text-3xl">{prod.emoji || '🛍️'}</span>
                        )}
                        <div>
                          <div className="font-black text-sm">{prod.name}</div>
                          <div className={`text-[11px] ${theme.mutedText}`}>
                            Supply cost: ${prod.unitCost.toFixed(2)}
                          </div>
                        </div>
                      </div>
                      <div className="flex items-center gap-2">
                        <div className="flex items-center gap-1">
                          <span className="text-xs font-black text-emerald-500">$</span>
                          <input
                            type="number"
                            step="0.25"
                            min="0.25"
                            value={prod.price}
                            onChange={(e) => {
                              const updatedPrice = Math.max(0.25, parseFloat(e.target.value) || 0.25);
                              setProducts((prev) =>
                                prev.map((item) =>
                                  item.id === prod.id
                                    ? { ...item, price: Number(updatedPrice.toFixed(2)) }
                                    : item
                                )
                              );
                            }}
                            aria-label={`Edit price for ${prod.name}`}
                            className={`w-16 px-2 py-1 rounded-xl border text-xs font-black text-emerald-600 ${theme.inputBg}`}
                          />

                        <button

                          title="Delete item"

    // ============================================================================
    // MODULE 4: TYCOON PROGRESS DASHBOARD
    // ============================================================================
    function TycoonDashboardPage({
      theme,
      businessName,
      goalItemName,
      financialGoal,
      materialCost,
      totalTargetRevenue,
      dailySalesTarget,
      breakEvenPoint,
      totalRevenueEarned,
      netProfitEarned,
      shopOpen,
      hasBrokenEven,
      hasReachedGoal,
      durationDays,
      activeDay,
      setActiveDay,
      salesLog,
      onOpenShiftWrapUp,
      onAddQuickDemoSale,
      onGoRegister,
      onBackHome
    }) {
      const breakEvenPct =
        breakEvenPoint > 0
          ? Math.min(100, Math.round((totalRevenueEarned / breakEvenPoint) * 100))
          : totalRevenueEarned > 0
          ? 100
          : 0;
      const totalGoalPct =
        totalTargetRevenue > 0
          ? Math.min(100, Math.round((totalRevenueEarned / totalTargetRevenue) * 100))
          : 0;

      const chartDays = Array.from({ length: durationDays }, (_, idx) => {
        const dayNum = idx + 1;
        const targetCumulative = Number((dailySalesTarget * dayNum).toFixed(2));
        const actualCumulative = Number(
          salesLog
            .filter((tx) => tx.day <= dayNum)
            .reduce((sum, tx) => sum + tx.total, 0)
            .toFixed(2)
        );
        return {
          day: dayNum,
          targetCumulative,
          actualCumulative: dayNum <= activeDay ? actualCumulative : null
        };
      });

      const maxY = Math.max(totalTargetRevenue, totalRevenueEarned, 10) * 1.15;
      const svgW = 540;
      const svgH = 220;
      const padL = 48;
      const padR = 24;
      const padT = 22;
      const padB = 34;
      const plotW = svgW - padL - padR;
      const plotH = svgH - padT - padB;

      const getX = (idx) =>
        chartDays.length <= 1 ? padL + plotW / 2 : padL + (idx / (chartDays.length - 1)) * plotW;
      const getY = (val) => padT + plotH - (val / maxY) * plotH;

      const targetPoints = chartDays.map((d, i) => `${getX(i)},${getY(d.targetCumulative)}`).join(' ');
      const activePoints = chartDays
        .filter((d) => d.actualCumulative !== null)
        .map((d, i) => `${getX(i)},${getY(d.actualCumulative)}`)
        .join(' ');

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <button
                onClick={onBackHome}
                className={`inline-flex items-center gap-1.5 text-xs font-extrabold px-3 py-1 rounded-full border mb-2 cursor-pointer ${theme.pillBg}`}
              >
                <ArrowLeft className="w-3.5 h-3.5" />
                <span>Back to Home Hub</span>
              </button>
              <h1 className="text-2xl sm:text-3xl font-black">{businessName} — Tycoon Board</h1>
            </div>

            <div className="flex flex-wrap items-center gap-2">
              {shopOpen && (
                <button
                  onClick={onOpenShiftWrapUp}
                  className={`inline-flex items-center gap-1.5 px-4 py-2.5 rounded-full border-2 font-black text-xs cursor-pointer ${theme.secondaryBtn}`}
                >
                  <span>🌙 Close Shop & Split Profit Jars</span>
                </button>
              )}
              {shopOpen && (
                <button
                  onClick={onGoRegister}
                  className={`inline-flex items-center gap-1.5 px-4 py-2.5 rounded-full border-2 font-black text-xs cursor-pointer ${theme.primaryBtn}`}
                >
                  <ScanBarcode className="w-4 h-4" />
                  <span>Cash Register</span>
                </button>
              )}
            </div>
          </div>

          <div className="grid grid-cols-2 lg:grid-cols-4 gap-3.5">
            <div className={`${theme.card} border-2 ${theme.cardShadow} rounded-3xl p-4`}>
              <div className={`text-xs font-bold ${theme.mutedText}`}>Total Collected</div>
              <div className="text-2xl font-black mt-1">${totalRevenueEarned.toFixed(2)}</div>
            </div>
            <div className={`${theme.card} border-2 ${theme.cardShadow} rounded-3xl p-4`}>
              <div className={`text-xs font-bold ${theme.mutedText}`}>Supply Break-Even</div>
              <div className="text-2xl font-black text-amber-500 mt-1">${breakEvenPoint.toFixed(2)}</div>
            </div>
            <div className={`${theme.card} border-2 ${theme.cardShadow} rounded-3xl p-4`}>
              <div className={`text-xs font-bold ${theme.mutedText}`}>Net Profit</div>
              <div
                className={`text-2xl font-black mt-1 ${
                  netProfitEarned >= 0 ? 'text-emerald-500' : 'text-rose-500'
                }`}
              >
                {netProfitEarned >= 0
                  ? `+$${netProfitEarned.toFixed(2)}`
                  : `-$${Math.abs(netProfitEarned).toFixed(2)}`}
              </div>
            </div>
            <div className={`${theme.card} border-2 ${theme.cardShadow} rounded-3xl p-4`}>
              <div className={`text-xs font-bold ${theme.mutedText}`}>Goal ({goalItemName})</div>
              <div className="text-2xl font-black text-sky-500 mt-1">${Number(financialGoal).toFixed(2)}</div>
            </div>
          </div>

          <div
            className={`rounded-3xl p-6 border-2 transition-colors ${
              hasBrokenEven
                ? 'bg-emerald-500/15 border-emerald-500'
                : `${theme.card} ${theme.cardShadow}`
            }`}
          >
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3">
              <div>
                <span
                  className={`text-xs font-black uppercase tracking-wider px-3 py-1 rounded-full ${
                    hasBrokenEven ? 'bg-emerald-500 text-slate-950' : 'bg-amber-400 text-slate-950'
                  }`}
                >
                  {hasReachedGoal
                    ? `🎉 Goal Reached! Ready to Buy ${goalItemName}!`
                    : hasBrokenEven
                    ? '🚀 PROFIT ZONE UNLOCKED! Supplies Paid Off!'
                    : `⏳ Break-Even Journey: $${Math.max(0, breakEvenPoint - totalRevenueEarned).toFixed(2)} Left`}
                </span>
              </div>
              <div className="text-xs font-extrabold">
                Break-Even: <strong>{breakEvenPct}%</strong> • Overall Goal:{' '}
                <strong>{totalGoalPct}%</strong>
              </div>
            </div>

            <div className="w-full h-7 bg-white/85 rounded-full overflow-hidden border border-black/10 p-1">
              <div
                className={`h-full rounded-full transition-all duration-500 ${
                  hasBrokenEven ? 'bg-emerald-500' : 'bg-amber-400'

                style={{ width: `${Math.max(4, totalGoalPct)}%` }}
              />
            </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div
              className={`lg:col-span-7 ${theme.card} border-2 ${theme.cardShadow} rounded-3xl p-6 space-y-4`}
            >
              <div className="flex flex-wrap items-center justify-between gap-2">
                <div>
                  <h2 className="text-base font-black">Cumulative Earnings vs. Daily Target</h2>
                  <p className={`text-xs ${theme.mutedText}`}>
